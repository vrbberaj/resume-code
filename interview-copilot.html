<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Balaajee V.R. — Live Interview Co-Pilot & Teleprompter HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-oled: #06090F;
      --bg-panel: #0B101B;
      --bg-card: #111827;
      --border-subtle: rgba(148, 163, 184, 0.15);
      --border-focus: rgba(245, 183, 3, 0.5);
      --text-primary: #F1F5F9;
      --text-secondary: #CBD5E1;
      --text-muted: #64748B;
      --accent-gold: #F5B703;
      --accent-emerald: #10B981;
      --accent-sky: #38BDF8;
      --accent-rose: #F00658;
      --hud-width: 820px;
      --prompt-font-size: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg-oled);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* =========================================================================
       TOP-CENTER CAMERA EYE-LINE ANCHOR BAR
       ========================================================================= */
    .camera-anchor-bar {
      width: 100%;
      height: 28px;
      background: #030508;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #94A3B8;
      letter-spacing: 0.05em;
    }

    .camera-target-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 10px var(--accent-emerald);
      animation: pulseDot 2s infinite ease-in-out;
    }

    .camera-target-dot.listening {
      background: var(--accent-rose);
      box-shadow: 0 0 12px var(--accent-rose);
      animation: pulseFast 0.8s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes pulseFast {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.38); }
    }

    /* =========================================================================
       MAIN CAMERA-CENTERED HUD CONTAINER
       ========================================================================= */
    .hud-shell {
      max-width: var(--hud-width);
      width: 100%;
      height: calc(100vh - 28px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 8px 14px 12px;
      gap: 8px;
    }

    /* 1. LIVE LISTENER & HEADPHONE TAB CAPTURE BAR */
    .listener-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 7px 10px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .btn-listen {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7.5px 13px;
      border-radius: 999px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.14);
      color: #34D399;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s ease;
    }

    .btn-listen:hover {
      background: rgba(16, 185, 129, 0.24);
    }

    .btn-listen.active {
      background: var(--accent-rose);
      border-color: #FF4D8D;
      color: #FFFFFF;
      box-shadow: 0 0 16px rgba(240, 6, 88, 0.45);
    }

    .btn-headphone {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7.5px 13px;
      border-radius: 999px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.13);
      color: #38BDF8;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s ease;
    }

    .btn-headphone:hover {
      background: rgba(56, 189, 248, 0.24);
    }

    .btn-headphone.active {
      background: #0284C7;
      border-color: #7DD3FC;
      color: #FFFFFF;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.45);
    }

    /* Live Audio Level Meter (Shows call audio coming through headphones) */
    .audio-meter {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 16px;
      padding: 0 4px;
    }
    .meter-bar {
      width: 3px;
      height: 4px;
      background: #38BDF8;
      border-radius: 2px;
      transition: height 0.08s ease;
    }

    .transcript-input-wrap {
      flex: 1;
      min-width: 220px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .transcript-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 8px;
      padding: 7.5px 115px 7.5px 11px;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .transcript-input:focus {
      border-color: var(--accent-gold);
    }

    .transcript-input::placeholder {
      color: #64748B;
    }

    .input-actions {
      position: absolute;
      right: 5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-ask-now {
      background: var(--accent-gold);
      border: none;
      color: #06090F;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-clear-input {
      background: rgba(148, 163, 184, 0.16);
      border: none;
      color: #CBD5E1;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 7px;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-clear-input:hover {
      color: #FFFFFF;
      background: rgba(148, 163, 184, 0.3);
    }

    /* LIVE HEARD QUESTION BANNER */
    .heard-question-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 9px;
      padding: 6px 12px;
      font-size: 12.5px;
      color: #E2E8F0;
      flex-shrink: 0;
    }

    .heard-question-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .heard-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.16);
      color: #38BDF8;
      flex-shrink: 0;
    }

    .heard-text {
      font-weight: 600;
      color: #F8FAFC;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 2. INSTANT TOPIC TRIGGER PILLS (1-Click or Keys 1-9, 0) */
    .quick-topics-strip {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      padding: 2px 0;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .quick-topics-strip::-webkit-scrollbar { display: none; }

    .topic-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4.5px 9.5px;
      border-radius: 999px;
      background: #0F172A;
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: #94A3B8;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .topic-pill:hover {
      color: #F8FAFC;
      border-color: rgba(148, 163, 184, 0.4);
      background: #1E293B;
    }

    .topic-pill.active {
      background: rgba(245, 183, 3, 0.15);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .topic-key {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: #CBD5E1;
    }

    /* 3. TIER-1 GLANCEABLE CUE CARD (RIGHT UNDER WEBCAM) */
    .glance-cue-card {
      background: linear-gradient(180deg, #11192B 0%, #0D1322 100%);
      border: 1.5px solid var(--border-focus);
      border-radius: 14px;
      padding: 11px 15px;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      transition: border-color 0.2s ease;
    }

    .glance-cue-card.flash-update {
      border-color: #10B981;
      box-shadow: 0 0 22px rgba(16, 185, 129, 0.35);
    }

    .cue-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .cue-matched-topic {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-sky);
    }

    .cue-confidence-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.15);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .cue-opening-hook {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.32;
      color: var(--accent-gold);
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .cue-metrics-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .cue-metric-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #E0F2FE;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
    }

    .cue-anchors-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .cue-anchor-box {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 8px;
      padding: 5.5px 9px;
    }

    .cue-anchor-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: #94A3B8;
      margin-bottom: 2px;
      display: block;
    }

    .cue-anchor-text {
      font-size: 11.5px;
      font-weight: 600;
      color: #F1F5F9;
      line-height: 1.3;
    }

    /* 4. TIER-2 AUTO-SCROLLING TELEPROMPTER STAGE */
    .teleprompter-wrap {
      flex: 1;
      min-height: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .teleprompter-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6.5px 14px;
      background: #080C14;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
      gap: 10px;
    }

    .prompter-controls-left,
    .prompter-controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-prompter {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 11px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: #1E293B;
      color: #F8FAFC;
      transition: all 0.15s ease;
    }

    .btn-prompter.playing {
      background: var(--accent-emerald);
      border-color: #059669;
      color: #042F2E;
    }

    .speed-control {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #94A3B8;
    }

    .speed-slider {
      width: 75px;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .reading-guide-band {
      position: absolute;
      top: 52px;
      left: 0;
      right: 0;
      height: 44px;
      background: rgba(245, 183, 3, 0.06);
      border-top: 1px solid rgba(245, 183, 3, 0.24);
      border-bottom: 1px solid rgba(245, 183, 3, 0.24);
      pointer-events: none;
      z-index: 2;
    }

    .reading-guide-arrow {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent-gold);
      font-size: 13px;
      font-weight: 900;
    }

    .teleprompter-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 32px 160px 32px;
      scroll-behavior: auto;
      position: relative;
      z-index: 3;
    }

    .teleprompter-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .teleprompter-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 3px;
    }

    .script-sentence {
      font-size: var(--prompt-font-size);
      font-weight: 600;
      line-height: 1.55;
      color: #CBD5E1;
      margin-bottom: 14px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .script-sentence:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #FFFFFF;
    }

    .script-sentence.active-line {
      color: #FFFFFF;
      background: rgba(245, 183, 3, 0.09);
    }

    .script-sentence strong {
      color: var(--accent-gold);
      font-weight: 800;
    }

    .script-sentence em {
      color: var(--accent-sky);
      font-style: normal;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- TOP CAMERA EYE-LINE ANCHOR -->
  <div class="camera-anchor-bar">
    <span class="camera-target-dot" id="cameraPulseDot"></span>
    <span id="cameraStatusText">KEEP EYES HERE (BELOW WEBCAM) • ZERO-KEY LIVE AI CO-PILOT • [SPACE] SCROLL/PAUSE</span>
  </div>

  <div class="hud-shell">

    <!-- 1. LIVE SPEECH & HEADPHONE CALL AUDIO BAR -->
    <div class="listener-bar">
      <button type="button" class="btn-listen" id="btnToggleMic" title="Listen continuously via microphone/speaker">
        <span>🎙️</span>
        <span id="micLabel">Listen Live</span>
      </button>

      <button type="button" class="btn-headphone" id="btnHeadphoneMode" title="Option 1: Share Google Meet / Zoom / Teams Tab Audio while wearing headphones">
        <span>🎧</span>
        <span id="headphoneLabel">Headphone / Tab Audio</span>
        <span class="audio-meter" id="audioMeter" aria-hidden="true">
          <span class="meter-bar" id="mBar1"></span>
          <span class="meter-bar" id="mBar2"></span>
          <span class="meter-bar" id="mBar3"></span>
          <span class="meter-bar" id="mBar4"></span>
        </span>
      </button>

      <div class="transcript-input-wrap">
        <input
          type="text"
          id="questionInput"
          class="transcript-input"
          placeholder="Speak or type ANY question (e.g. 'Why are you leaving IBM?', 'How do you handle a weak designer?', 'Tell me about a failure')..."
          autocomplete="off"
        />
        <div class="input-actions">
          <button type="button" class="btn-ask-now" id="btnAskNow">Answer ↵</button>
          <button type="button" class="btn-clear-input" id="btnClearInput">✕</button>
        </div>
      </div>
    </div>

    <!-- LIVE HEARD QUESTION ECHO BAR -->
    <div class="heard-question-banner" id="heardBanner">
      <div class="heard-question-left">
        <span class="heard-tag" id="heardModeTag">LIVE QUESTION</span>
        <span class="heard-text" id="heardQuestionText">Waiting for interviewer question... (Click "Listen Live" or type any question above)</span>
      </div>
      <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#94A3B8;flex-shrink:0;" id="latencyBadge">⚡ &lt;30ms Zero-Key Engine</span>
    </div>

    <!-- 2. INSTANT 1-CLICK TOPIC PILLS (HOTKEYS 1-9, 0) -->
    <div class="quick-topics-strip" id="quickTopicsStrip" role="tablist"></div>

    <!-- 3. TIER-1 GLANCEABLE CUE CARD -->
    <section class="glance-cue-card" id="glanceCueCard" aria-label="Instant Executive Cue Card">
      <div class="cue-header-row">
        <div class="cue-matched-topic">
          <span>⚡ LIVE ANSWER STRATEGY:</span>
          <strong id="cueTopicName">01 • 60-Second Executive Intro Pitch</strong>
        </div>
        <span class="cue-confidence-badge" id="cueMatchStatus">READY • ZERO API KEY</span>
      </div>

      <div class="cue-opening-hook" id="cueOpeningHook"></div>
      <div class="cue-metrics-row" id="cueMetricsRow"></div>
      <div class="cue-anchors-grid" id="cueAnchorsGrid"></div>
    </section>

    <!-- 4. TIER-2 AUTO-SCROLLING TELEPROMPTER -->
    <section class="teleprompter-wrap" aria-label="Conversational Teleprompter">
      <div class="teleprompter-toolbar">
        <div class="prompter-controls-left">
          <button type="button" class="btn-prompter" id="btnPlayPause">
            ▶ Auto-Scroll (Space)
          </button>
          <button type="button" class="btn-prompter" id="btnResetScroll">
            ↺ Top (R)
          </button>
        </div>

        <div class="prompter-controls-right">
          <label class="speed-control">
            <span>Speed:</span>
            <input type="range" id="scrollSpeedSlider" class="speed-slider" min="0.4" max="2.5" step="0.1" value="1.1" />
            <span id="scrollSpeedVal">1.1×</span>
          </label>
          <label class="speed-control">
            <span>Text:</span>
            <button type="button" class="btn-prompter" id="btnFontDown" style="padding:2px 7px;">A-</button>
            <button type="button" class="btn-prompter" id="btnFontUp" style="padding:2px 7px;">A+</button>
          </label>
        </div>
      </div>

      <div class="reading-guide-band" aria-hidden="true">
        <span class="reading-guide-arrow">▶</span>
      </div>

      <div class="teleprompter-scroll" id="teleprompterScroll">
        <div id="teleprompterContent"></div>
      </div>
    </section>

  </div>

  <script>
    // =========================================================================
    // 1. CORE CASE STUDIES & EXECUTIVE KNOWLEDGE BASE (BALAAJEE V.R.)
    // =========================================================================
    const PLAYBOOKS = [
      {
        id: 'intro',

          'On the product side, I specialize in <strong>Enterprise AI Governance, Multi-Brand Design Systems, and complex B2B workflows</strong> — cutting engineering modeling at IBM from <strong>14.2 hours to 3.6 hours</strong>, and cutting 5G telecom quoting at Ericsson from <strong>6 days to 42 minutes</strong>.'
        ]
      },
      {
        id: 'ibm-ai',
        key: '2',
        shortLabel: '2 • IBM Agentic AI',
        title: 'IBM watsonx, Rhapsody SE & MaaS360 (Agentic AI & Human-in-the-Loop)',
        keywords: ['ibm', 'watson', 'watsonx', 'maas360', 'rhapsody', 'agentic', 'ai', 'artificial intelligence', 'human in the loop', 'confidence', 'security', 'triage', 'trust', 'black box', 'hallucination', 'llm', 'copilot', 'genai', 'generative'],
        hook: '“At IBM Software Labs, the biggest barrier to enterprise AI adoption wasn’t model accuracy—it was operator trust and black-box risk in mission-critical workflows.”',

- Leadership & Availability: Restructured 14+ designers into agile UX-as-a-Service model with 100% team retention, promoted 2 seniors to Lead, mentored 50+ designers. Started career in engineering at Infosys. Immediate availability (0 days notice), open to India & global relocation (10-yr US B1/B2 visa, EU Blue Card eligible).
Return ONLY valid JSON matching this exact structure:
{"title":"LIVE AI • Short Topic Title","hook":"“One punchy opening sentence in quotes that directly answers the question.”","anchors":[{"label":"1. Key Pillar","text":"12-word summary"},{"label":"2. Execution","text":"12-word summary"},{"label":"3. Measurable Impact","text":"12-word summary with metrics"}],"sentences":["First sentence directly answering the question with <strong>bold key phrases</strong>.","Second sentence giving the specific example at IBM, Ericsson, Zebra, or ZF Wabco.","Third sentence explaining how you executed it with <strong>bold metrics</strong>.","Fourth sentence tying it back to the value you bring to their team."]}`
          },
          { role: 'user', content: `Interviewer Question: "${clean}"` }
        ];

        let res = await fetch('/api/copilot/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: clean, messages: aiMessages })
        }).catch(() => null);

        if (!res || !res.ok) {
          res = await fetch('https://text.pollinations.ai/openai', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: 'openai-fast', messages: aiMessages })
          });
        }

        if (reqId !== liveRequestCounter || !res.ok) return;
        const data = await res.json();
        const content = data?.choices?.[0]?.message?.content;
        if (!content) return;
        const jsonMatch = content.match(/\{[\s\S]*\}/);
        if (!jsonMatch) return;
        const parsed = JSON.parse(jsonMatch[0]);
        if (parsed && Array.isArray(parsed.sentences) && parsed.sentences.length >= 2) {
          if (parsed.title) cueTopicName.textContent = parsed.title;
          if (parsed.hook) cueOpeningHook.textContent = parsed.hook;
          if (Array.isArray(parsed.anchors) && parsed.anchors.length === 3) {
            cueAnchorsGrid.innerHTML = parsed.anchors
              .map(
                (a) => `
                <div class="cue-anchor-box">
                  <span class="cue-anchor-label">${a.label || 'Key Point'}</span>
                  <div class="cue-anchor-text">${a.text || ''}</div>
                </div>`
              )
              .join('');
          }
          teleprompterContent.innerHTML = parsed.sentences
            .map((line, idx) => `<div class="script-sentence ${idx === 0 ? 'active-line' : ''}">${line}</div>`)
            .join('');
          cueMatchStatus.textContent = '✨ LIVE AI TAILORED (NO KEY)';
          latencyBadge.textContent = '✨ AI Tailored Live';
        }
      } catch (err) {
        // Instant answer is already on screen, so zero disruption!
      }
    }

    // =========================================================================
    // 6. OPTION 1: HEADPHONE / CALL TAB AUDIO CAPTURE + IN-BROWSER WHISPER ASR
    //    Captures Google Meet / Zoom / Teams tab audio directly even when wearing
    //    headphones, visualizes audio levels, and transcribes speech in-browser!
    // =========================================================================
    let tabAudioStream = null;
    let audioCtx = null;
    let analyserNode = null;
    let meterAnimId = null;
    let whisperPipe = null;
    let whisperLoading = false;
    let tabProcessorNode = null;

    const mBars = [
      document.getElementById('mBar1'),
      document.getElementById('mBar2'),
      document.getElementById('mBar3'),
      document.getElementById('mBar4')
    ];

    function updateAudioMeter() {
      if (!analyserNode) return;
      const data = new Uint8Array(analyserNode.frequencyBinCount);
      analyserNode.getByteFrequencyData(data);
      const buckets = [data[2] || 0, data[6] || 0, data[12] || 0, data[20] || 0];
      buckets.forEach((val, idx) => {
        const h = Math.max(3, Math.min(16, Math.round((val / 255) * 16)));
        if (mBars[idx]) mBars[idx].style.height = h + 'px';
      });
      meterAnimId = requestAnimationFrame(updateAudioMeter);
    }

    async function ensureInBrowserWhisperLoaded() {
      if (whisperPipe || whisperLoading) return whisperPipe;
      whisperLoading = true;
      try {
        latencyBadge.textContent = '🎧 Loading Headphone Speech AI...';
        const mod = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
        mod.env.allowLocalModels = false;
        whisperPipe = await mod.pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en');
        latencyBadge.textContent = '🎧 Headphone AI Ready (Zero Key)';
      } catch (e) {
        console.warn('In-browser Whisper fallback note:', e);
      } finally {
        whisperLoading = false;
      }
      return whisperPipe;
    }

    btnHeadphoneMode.addEventListener('click', async () => {
      if (tabAudioStream) {
        tabAudioStream.getTracks().forEach((t) => t.stop());
        tabAudioStream = null;
        if (tabProcessorNode) {
          try { tabProcessorNode.disconnect(); } catch (e) {}
          tabProcessorNode = null;
        }
        if (meterAnimId) cancelAnimationFrame(meterAnimId);
        btnHeadphoneMode.classList.remove('active');
        headphoneLabel.textContent = 'Headphone / Tab Audio';
        return;
      }

      try {
        // Prompt user to select their Google Meet / Zoom / Teams browser tab with "Also share tab audio" ON
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        tabAudioStream = stream;
        btnHeadphoneMode.classList.add('active');
        headphoneLabel.textContent = 'Headphone Tab Active';
        heardModeTag.textContent = 'HEADPHONE AUDIO';
        heardQuestionText.textContent = 'Connected to call tab audio — listening for interviewer questions...';

        // Load in-browser Whisper ASR in background so tab audio is transcribed even with headphones on
        ensureInBrowserWhisperLoaded();

        // Connect live 16kHz audio context for both spectrum meter AND direct headphone VAD transcription
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const source = audioCtx.createMediaStreamSource(stream);
        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 64;
        source.connect(analyserNode);
        updateAudioMeter();

        // Voice Activity Detection (VAD) buffer on shared tab audio
        if (stream.getAudioTracks().length > 0) {
          const processor = audioCtx.createScriptProcessor(4096, 1, 1);
          tabProcessorNode = processor;
          let speechChunks = [];
          let totalSamples = 0;
          let speaking = false;
          let silenceFrames = 0;
          let transcribingTab = false;

          processor.onaudioprocess = async (e) => {
            const input = e.inputBuffer.getChannelData(0);
            let sumSq = 0;
            for (let i = 0; i < input.length; i++) sumSq += input[i] * input[i];
            const rms = Math.sqrt(sumSq / input.length);

            if (rms > 0.012) {
              speaking = true;
              silenceFrames = 0;
              speechChunks.push(new Float32Array(input));
              totalSamples += input.length;
            } else if (speaking) {
              silenceFrames++;
              speechChunks.push(new Float32Array(input));
              totalSamples += input.length;

              // ~0.75s of silence (3 frames at 4096/16000Hz) or >6 seconds of continuous speech
              if (silenceFrames >= 3 || totalSamples >= 16000 * 6) {
                speaking = false;
                silenceFrames = 0;
                const capturedSamples = totalSamples;
                const chunksToProcess = speechChunks;
                speechChunks = [];
                totalSamples = 0;

                if (capturedSamples > 16000 * 0.9 && whisperPipe && !transcribingTab) {
                  transcribingTab = true;
                  try {
                    const merged = new Float32Array(capturedSamples);
                    let offset = 0;
                    for (const c of chunksToProcess) {
                      merged.set(c, offset);
                      offset += c.length;
                    }
                    const out = await whisperPipe(merged);
                    const text = (out?.text || '').replace(/\[.*?\]|\(.*?\)/g, '').trim();
                    if (text && text.length > 6 && text !== lastProcessedQuestion) {
                      lastProcessedQuestion = text;
                      questionInput.value = text;
                      processLiveInterviewerQuestion(text, 'HEADPHONE TAB AUDIO');
                    }
                  } catch (err) {
                    // ignore chunk err
                  } finally {
                    transcribingTab = false;
                  }
                }
              }
            }
          };

          source.connect(processor);
          processor.connect(audioCtx.destination);
        } else {
          heardModeTag.textContent = 'ENABLE TAB AUDIO';
          heardQuestionText.textContent = 'Please re-click Headphone mode and check "Also share tab audio" in the popup!';
        }

        // Also ensure continuous SpeechRecognition is active in parallel
        if (!isListening) {
          btnToggleMic.click();
        }

        stream.getVideoTracks()[0]?.addEventListener('ended', () => {
          btnHeadphoneMode.classList.remove('active');
          headphoneLabel.textContent = 'Headphone / Tab Audio';
          tabAudioStream = null;
        });
      } catch (err) {
        heardModeTag.textContent = 'HEADPHONE TIP';
        heardQuestionText.textContent = 'Select your Meet/Zoom browser tab and check "Also share tab audio"';
      }
    });

    // =========================================================================
    // 7. CONTINUOUS LIVE SPEECH LISTENER (AUTO-SEGMENTS EVERY NEW QUESTION)
    // =========================================================================
    let consumedResultIdx = -1;
    let consumedCharLen = 0;

    function initSpeechRecognition() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        alert('Live speech recognition requires Google Chrome or Microsoft Edge.');
        return null;
      }
      const rec = new SpeechRec();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = 'en-US';

      rec.onresult = (event) => {
        const currentIdx = event.results.length - 1;
        const latestResult = event.results[currentIdx];
        const rawTranscript = (latestResult[0]?.transcript || '').trim();
        if (!rawTranscript) return;

        // If Chrome moved to a new result slot, reset our consumed character offset
        if (currentIdx !== consumedResultIdx) {
          consumedResultIdx = currentIdx;
          consumedCharLen = 0;
        }

        // Slice ONLY the newly spoken words since the last answered pause so old questions never get stuck!
        let activeUtterance = rawTranscript.slice(consumedCharLen).trim();
        if (!activeUtterance) activeUtterance = rawTranscript;

        questionInput.value = activeUtterance;
        heardModeTag.textContent = latestResult.isFinal ? 'INTERVIEWER ASKED' : 'LISTENING LIVE...';
        heardQuestionText.textContent = `“${activeUtterance}”`;

        clearTimeout(silenceTimer);
        if (latestResult.isFinal) {
          if (activeUtterance.length > 4 && activeUtterance !== lastProcessedQuestion) {
            lastProcessedQuestion = activeUtterance;
            processLiveInterviewerQuestion(activeUtterance, 'LIVE SPEECH');
          }
          consumedCharLen = rawTranscript.length;
        } else {
          silenceTimer = setTimeout(() => {
            const freshSlice = rawTranscript.slice(consumedCharLen).trim();
            if (freshSlice.length > 8 && freshSlice !== lastProcessedQuestion) {
              lastProcessedQuestion = freshSlice;
              consumedCharLen = rawTranscript.length;
              processLiveInterviewerQuestion(freshSlice, 'LIVE SPEECH');
            }
          }, 750);
        }
      };

      rec.onend = () => {
        if (isListening) {
          try {
            rec.start();
          } catch (e) {}
        }
      };

      return rec;
    }

    btnToggleMic.addEventListener('click', () => {
      if (!recognition) {
        recognition = initSpeechRecognition();
        if (!recognition) return;
      }
      isListening = !isListening;
      if (isListening) {
        try {
          recognition.start();
        } catch (e) {}
        btnToggleMic.classList.add('active');
        micLabel.textContent = 'Listening Live...';
        cameraPulseDot.classList.add('listening');
        cameraStatusText.textContent = '🔴 LIVE LISTENING ACTIVE • EVERY QUESTION TRIGGERS AN INSTANT TAILORED ANSWER';
      } else {
        try {
          recognition.stop();
        } catch (e) {}
        btnToggleMic.classList.remove('active');
        micLabel.textContent = 'Listen Live';
        cameraPulseDot.classList.remove('listening');
        cameraStatusText.textContent = 'KEEP EYES HERE (BELOW WEBCAM) • ZERO-KEY LIVE AI CO-PILOT • [SPACE] SCROLL/PAUSE';
      }
    });

    // Manual / Typed Question Trigger
    function triggerTypedQuestion() {
      const val = questionInput.value.trim();
      if (val) {
        processLiveInterviewerQuestion(val, 'TYPED QUESTION');
      }
    }

    btnAskNow.addEventListener('click', triggerTypedQuestion);
    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        triggerTypedQuestion();
      }
    });

    // Also update live as user types after 450ms pause
    let typeTimer = null;
    questionInput.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      clearTimeout(typeTimer);
      if (val.length > 5) {
        typeTimer = setTimeout(() => {
          processLiveInterviewerQuestion(val, 'LIVE INPUT');
        }, 450);
      }
    });

    btnClearInput.addEventListener('click', () => {
      questionInput.value = '';
      questionInput.focus();
    });

    // =========================================================================
    // 8. SMOOTH AUTO-SCROLL TELEPROMPTER ENGINE
    // =========================================================================
    function updateActiveSentenceHighlight() {
      const sentences = teleprompterContent.querySelectorAll('.script-sentence');
      const scrollY = teleprompterScroll.scrollTop + 42;
      let activeEl = sentences[0];
      sentences.forEach((el) => {
        if (el.offsetTop <= scrollY) {
          activeEl = el;
        }
        el.classList.remove('active-line');
      });
      if (activeEl) activeEl.classList.add('active-line');
    }

    function stepAutoScroll() {
      if (!isScrolling) return;
      scrollAccum += scrollSpeed * 0.42;
      if (scrollAccum >= 1) {
        const px = Math.floor(scrollAccum);
        teleprompterScroll.scrollTop += px;
        scrollAccum -= px;
        updateActiveSentenceHighlight();
      }
      animFrameId = requestAnimationFrame(stepAutoScroll);
    }

    function toggleAutoScroll() {
      isScrolling = !isScrolling;
      if (isScrolling) {
        btnPlayPause.textContent = '⏸ Pause Scroll (Space)';
        btnPlayPause.classList.add('playing');
        animFrameId = requestAnimationFrame(stepAutoScroll);
      } else {
        btnPlayPause.textContent = '▶ Auto-Scroll (Space)';
        btnPlayPause.classList.remove('playing');
        if (animFrameId) cancelAnimationFrame(animFrameId);
      }
    }

    btnPlayPause.addEventListener('click', toggleAutoScroll);
    btnResetScroll.addEventListener('click', () => {
      teleprompterScroll.scrollTop = 0;
      updateActiveSentenceHighlight();
    });
    teleprompterScroll.addEventListener('scroll', updateActiveSentenceHighlight, { passive: true });

    scrollSpeedSlider.addEventListener('input', (e) => {
      scrollSpeed = parseFloat(e.target.value) || 1.0;
      scrollSpeedVal.textContent = scrollSpeed.toFixed(1) + '×';
    });

    btnFontDown.addEventListener('click', () => {
      fontSizePx = Math.max(16, fontSizePx - 2);
      document.documentElement.style.setProperty('--prompt-font-size', fontSizePx + 'px');
    });
    btnFontUp.addEventListener('click', () => {
      fontSizePx = Math.min(32, fontSizePx + 2);
      document.documentElement.style.setProperty('--prompt-font-size', fontSizePx + 'px');
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (document.activeElement === questionInput) {
        if (e.key === 'Escape') document.activeElement.blur();
        return;
      }
      if (e.code === 'Space') {
        e.preventDefault();
        toggleAutoScroll();
      } else if (e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        teleprompterScroll.scrollTop = 0;
        updateActiveSentenceHighlight();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        scrollSpeed = Math.min(2.5, +(scrollSpeed + 0.1).toFixed(1));
        scrollSpeedSlider.value = scrollSpeed;
        scrollSpeedVal.textContent = scrollSpeed.toFixed(1) + '×';
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        scrollSpeed = Math.max(0.4, +(scrollSpeed - 0.1).toFixed(1));
        scrollSpeedSlider.value = scrollSpeed;
        scrollSpeedVal.textContent = scrollSpeed.toFixed(1) + '×';
      } else {
        const matched = PLAYBOOKS.find((pb) => pb.key === e.key);
        if (matched) {
          e.preventDefault();
          activePlaybookId = matched.id;
          heardModeTag.textContent = `HOTKEY [${matched.key}]`;
          heardQuestionText.textContent = matched.title;
          renderAnswerToHUD(matched, `HOTKEY [${matched.key}]`);
        }
      }
    });

    // Boot with Playbook 01
    renderAnswerToHUD(PLAYBOOKS[0], 'READY • ZERO API KEY');
  </script>
