<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Balaajee V.R. • Zero-Eye-Movement Interview Teleprompter</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-void: #04070E;
      --bg-dock: #0C1322;
      --border-subtle: rgba(148, 163, 184, 0.16);
      --text-primary: #FFFFFF;
      --text-dim: rgba(203, 213, 225, 0.45);
      --accent-gold: #FBBF24;
      --accent-cyan: #38BDF8;
      --accent-emerald: #10B981;
      --accent-rose: #F43F5E;
      --accent-purple: #A855F7;
      --prompt-size: 30px;
      --column-width: 650px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-void);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-layout {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* =========================================================================
       1. TOP WEBCAM READING ZONE (NARROW 650px COLUMN RIGHT UNDER CAMERA!)
          Zero left-to-right eye movement. Huge 30px font readable from 3 feet.
       ========================================================================= */
    .webcam-reading-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      padding: 10px 20px 160px;
      scroll-behavior: auto;
    }

    .webcam-reading-stage::-webkit-scrollbar {
      width: 5px;
    }

    .webcam-reading-stage::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 999px;
    }

    /* Narrow column pinned dead-center under the laptop webcam */
    .narrow-eye-column {
      width: 100%;
      max-width: var(--column-width);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Tiny 1-line status right under webcam lens */
    .webcam-lens-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 4px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #94A3B8;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      padding-bottom: 8px;
    }

    .lens-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 12px var(--accent-emerald);
      flex-shrink: 0;
    }

    .lens-dot.listening {
      background: var(--accent-rose);
      box-shadow: 0 0 14px var(--accent-rose);
      animation: pulse 0.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.6; }
    }

    .heard-question-line {
      color: var(--accent-cyan);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 520px;
    }

    .speed-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--accent-emerald);
      flex-shrink: 0;
    }

    /* THE ANSWER STREAM — HUGE, HIGH-CONTRAST, ZERO CLUTTER */
    .answer-stream {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-top: 4px;
    }

    .answer-block {
      font-size: var(--prompt-size);
      line-height: 1.42;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.42);
      padding: 12px 16px;
      border-radius: 12px;
      border-left: 4px solid transparent;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    /* Active block right under the webcam is 100% bright white & gold */
    .answer-block.active-block {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.04);
      border-left-color: var(--accent-gold);
    }

    .answer-block:hover {
      color: #FFFFFF;
    }

    .answer-block strong {
      color: var(--accent-gold);
      font-weight: 800;
    }

    .answer-block em {
      color: var(--accent-cyan);
      font-style: normal;
      font-weight: 800;
    }

    /* Flash animation when a new answer arrives */
    @keyframes flashNewAnswer {
      0% { transform: translateY(-4px); opacity: 0.4; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .answer-stream.fresh-update {
      animation: flashNewAnswer 0.22s ease-out;
    }

    /* =========================================================================
       2. SUBTLE BOTTOM CONTROL DOCK (OUT OF YOUR EYE LINE!)
          Dimmed until hovered so it never distracts you during the interview
       ========================================================================= */
    .bottom-dock-wrapper {
      flex-shrink: 0;
      background: rgba(12, 19, 34, 0.92);
      border-top: 1px solid var(--border-subtle);
      padding: 8px 16px;
      opacity: 0.72;
      transition: opacity 0.2s ease;
    }

    .bottom-dock-wrapper:hover,
    .bottom-dock-wrapper:focus-within {
      opacity: 1;
    }

    .bottom-dock {
      max-width: 1060px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .dock-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dock-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: #131E36;
      color: #E2E8F0;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .dock-btn:hover {
      border-color: var(--accent-cyan);
      color: #FFFFFF;
    }

    .dock-btn.btn-mic.active {
      background: rgba(244, 63, 94, 0.22);
      border-color: var(--accent-rose);
      color: #FDA4AF;
    }

    .dock-btn.btn-headphone.active {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--accent-cyan);
      color: #FFFFFF;
    }

    .dock-btn.btn-scroll.playing {
      background: var(--accent-emerald);
      border-color: var(--accent-emerald);
      color: #04070E;
    }

    .dock-btn.btn-mock {
      border-color: rgba(168, 85, 247, 0.5);
      background: rgba(168, 85, 247, 0.16);
      color: #E9D5FF;
    }

    .dock-input-wrap {
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: center;
      position: relative;
    }

    .dock-input {
      width: 100%;
      background: #060A14;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 6px 76px 6px 14px;
      color: #FFFFFF;
      font-size: 12.5px;
      outline: none;
    }

    .dock-input:focus {
      border-color: var(--accent-cyan);
    }

    .btn-dock-ask {
      position: absolute;
      right: 4px;
      background: var(--accent-gold);
      color: #04070E;
      border: none;
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    /* Audio Spectrum Meter inside Headphone button */
    .audio-meter {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }

    .meter-bar {
      width: 3px;
      height: 3px;
      background: var(--accent-cyan);
      border-radius: 2px;
    }

    /* Quick Topic Hotkey Strip (Compact) */
    .hotkey-strip {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .hotkey-strip::-webkit-scrollbar {
      display: none;
    }

    .hk-pill {
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.14);
      background: rgba(15, 23, 42, 0.7);
      color: #94A3B8;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .hk-pill.active, .hk-pill:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    /* MODALS */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 14, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #0C1322;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      width: 100%;
      max-width: 680px;
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      border-bottom: 1px solid var(--border-subtle);
      font-weight: 800;
      font-size: 14px;
    }

    .modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13px;
      color: #CBD5E1;
    }

    .modal-textarea, .modal-input {
      width: 100%;
      background: #050811;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 9px 12px;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
    }

    .modal-textarea {
      min-height: 120px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 11px 18px;
      border-top: 1px solid var(--border-subtle);
    }

    .btn-save {
      background: var(--accent-emerald);
      color: #04070E;
      border: none;
      border-radius: 8px;
      padding: 7px 15px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- =====================================================================
         1. TOP WEBCAM READING ZONE (ONLY THE ANSWER — HUGE 30px, NARROW 650px)
         ===================================================================== -->
    <main class="webcam-reading-stage" id="readingStage">
      <div class="narrow-eye-column">
        <!-- Single subtle line right under webcam lens -->
        <div class="webcam-lens-bar">
          <span class="lens-dot" id="lensDot"></span>
          <span class="heard-question-line" id="heardQuestionLine">Ready — Click 🎙️ Listen Live or 🤖 Ask Me a Question below</span>
          <span class="speed-badge" id="speedBadge">⚡ Groq 120B Ready</span>
        </div>

        <!-- THE ANSWER (Only 3 short, huge 30px blocks right under your camera!) -->
        <div class="answer-stream" id="answerStream"></div>
      </div>
    </main>

    <!-- =====================================================================
         2. COMPACT BOTTOM CONTROL DOCK (KEPT OUT OF WEBCAM EYE LINE)
         ===================================================================== -->
    <footer class="bottom-dock-wrapper">
      <div class="bottom-dock">
        <div class="dock-row">
          <button type="button" class="dock-btn btn-mic" id="btnToggleMic">
            <span>🎙️</span>
            <span id="micLabel">Listen Live</span>
          </button>

          <button type="button" class="dock-btn btn-headphone" id="btnHeadphoneMode" title="Capture Google Meet / Zoom / Teams Tab Audio with headphones">
            <span>🎧</span>
            <span id="headphoneLabel">Headphone Audio</span>
            <span class="audio-meter">
              <span class="meter-bar" id="mBar1"></span>
              <span class="meter-bar" id="mBar2"></span>
              <span class="meter-bar" id="mBar3"></span>
              <span class="meter-bar" id="mBar4"></span>
            </span>
          </button>

          <!-- 1-Click Spoken AI Hiring Manager Buttons -->
          <button type="button" class="dock-btn btn-mock" id="btnMockAskQuestion" title="AI Hiring Manager speaks a question out loud & Co-Pilot answers">
            <span>🤖🔊</span>
            <span>Hiring Manager: Ask Question</span>
          </button>

          <button type="button" class="dock-btn btn-mock" id="btnMockFollowUp" title="AI Hiring Manager asks a follow-up question">
            <span>🔄</span>
            <span>Follow-Up</span>
          </button>

          <div class="dock-input-wrap">
            <input
              type="text"
              id="questionInput"
              class="dock-input"
              placeholder="Or type any question & press Enter..."
              autocomplete="off"
            />
            <button type="button" class="btn-dock-ask" id="btnAskNow">Ask ↵</button>
          </div>

          <button type="button" class="dock-btn btn-scroll" id="btnPlayPause">▶ Scroll (Space)</button>
          <button type="button" class="dock-btn" id="btnFontDown" title="Smaller text">A-</button>
          <button type="button" class="dock-btn" id="btnFontUp" title="Larger text">A+</button>
          <button type="button" class="dock-btn" id="btnOpenBrain" title="Edit Balaajee Brain & Target JD">🧠 Brain</button>
        </div>

        <!-- Subtle 1-line hotkey bar (Keys 1-0) -->
        <div class="hotkey-strip" id="hotkeyStrip"></div>
      </div>
    </footer>
  </div>

  <!-- BRAIN & TARGET JD MODAL -->
  <div class="modal-backdrop" id="brainModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>🧠 Balaajee V.R. Brain, Target Job & Groq Key</span>
        <button type="button" class="dock-btn" id="btnCloseBrainModal">✕</button>
      </div>
      <div class="modal-body">
        <div>
          <label style="font-size:11px; font-weight:700; color:var(--accent-gold); display:block; margin-bottom:4px;">TARGET COMPANY & JOB DESCRIPTION (OPTIONAL)</label>
          <textarea id="targetJobInput" class="modal-textarea" style="min-height:70px;" placeholder="e.g., ServiceNow — Director of Product Design (Enterprise AI)."></textarea>
        </div>
        <div>
          <label style="font-size:11px; font-weight:700; color:var(--accent-gold); display:block; margin-bottom:4px;">BALAAJEE V.R. MASTER DOSSIER (PRE-LOADED)</label>
          <textarea id="masterDossierInput" class="modal-textarea" style="min-height:160px;"></textarea>
        </div>
        <div>
          <label style="font-size:11px; font-weight:700; color:var(--accent-gold); display:block; margin-bottom:4px;">GROQ API KEY (PRE-CONNECTED)</label>
          <input type="password" id="groqKeyInput" class="modal-input" />
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-save" id="btnSaveBrain">Save ✓</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. BALAAJEE V.R. MASTER DOSSIER
    // =========================================================================

    // =========================================================================
    // 3. STATE & PRE-CONNECTED GROQ 120B ENGINE
    // =========================================================================
    const STORAGE_KEY_GROQ = 'bvr_groq_api_key';
    const STORAGE_KEY_DOSSIER = 'bvr_master_dossier';
    const STORAGE_KEY_TARGET_JD = 'bvr_target_job_context';
    const PRELOADED_REV_B64 = 'T1RINTc4cll4SEpxMmk5WUIyVkgzSk5jWUYzYnlkR1dkWTFKbFhBQVRqUFRXY3ZLQVM4bF9rc2c=';

    function decodePreloadedKey() {
      try { return atob(PRELOADED_REV_B64).split('').reverse().join(''); }
      catch (e) { return ''; }
    }

    let groqApiKey = (localStorage.getItem(STORAGE_KEY_GROQ) || decodePreloadedKey()).trim();
    let masterDossier = localStorage.getItem(STORAGE_KEY_DOSSIER) || DEFAULT_BALAAJEE_DOSSIER;
    let targetJobContext = localStorage.getItem(STORAGE_KEY_TARGET_JD) || '';
    let conversationHistory = [];

    let activePlaybookId = 'intro';
    let isScrolling = false;
    let scrollSpeed = 1.0;
    let scrollAccum = 0;
    let animFrameId = null;
    let isListening = false;
    let recognition = null;
    let fontSizePx = 30;
    let lastProcessedQuestion = '';
    let silenceTimer = null;
    let liveRequestCounter = 0;

    const readingStage = document.getElementById('readingStage');
    const lensDot = document.getElementById('lensDot');
    const heardQuestionLine = document.getElementById('heardQuestionLine');
    const speedBadge = document.getElementById('speedBadge');
    const answerStream = document.getElementById('answerStream');
    const hotkeyStrip = document.getElementById('hotkeyStrip');
    const questionInput = document.getElementById('questionInput');
    const btnToggleMic = document.getElementById('btnToggleMic');
    const micLabel = document.getElementById('micLabel');
    const btnHeadphoneMode = document.getElementById('btnHeadphoneMode');
    const headphoneLabel = document.getElementById('headphoneLabel');
    const btnPlayPause = document.getElementById('btnPlayPause');

    function renderHotkeys() {
      hotkeyStrip.innerHTML = '';
      PLAYBOOKS.forEach((pb) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'hk-pill' + (pb.id === activePlaybookId ? ' active' : '');
        b.textContent = pb.label;
        b.addEventListener('click', () => {
          activePlaybookId = pb.id;
          heardQuestionLine.textContent = pb.label;
          renderBlocksToScreen(pb.blocks, '⚡ Ready');
        });
        hotkeyStrip.appendChild(b);
      });
    }

    function renderBlocksToScreen(blocks, statusLabel = '⚡ Live Answer') {
      renderHotkeys();
      speedBadge.textContent = statusLabel;

      answerStream.classList.remove('fresh-update');
      void answerStream.offsetWidth;
      answerStream.classList.add('fresh-update');

      answerStream.innerHTML = (blocks || [])
        .map((line, idx) => {
          const cleanLine = String(line || '')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>');
          return `<div class="answer-block ${idx === 0 ? 'active-block' : ''}" data-idx="${idx}">${cleanLine}</div>`;
        })
        .join('');

      const els = answerStream.querySelectorAll('.answer-block');
      els.forEach((el) => {
        el.addEventListener('click', () => {
          els.forEach((x) => x.classList.remove('active-block'));
          el.classList.add('active-block');
          readingStage.scrollTop = el.offsetTop - 50;
        });
      });

      readingStage.scrollTop = 0;
    }

    // =========================================================================
    // 4. GROQ 120B STREAMING ENGINE (RETURNS ONLY 3 SHORT, EASY-TO-READ BLOCKS)
    // =========================================================================
    async function callGroq(messages, modelName = 'openai/gpt-oss-120b') {
      const payload = {
        model: modelName,
        temperature: 0.3,
        max_tokens: 600,
        response_format: { type: 'json_object' },
        messages
      };
      if (modelName.startsWith('openai/gpt-oss')) payload.reasoning_effort = 'low';

      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${groqApiKey}`
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        if (modelName === 'openai/gpt-oss-120b') return callGroq(messages, 'openai/gpt-oss-20b');
        if (modelName === 'openai/gpt-oss-20b') return callGroq(messages, 'qwen/qwen3.8-27b');
        throw new Error(`HTTP ${res.status}`);
      }
      return res.json();
    }

    function pickInstantBlocksForQuestion(q) {
      const lower = q.toLowerCase();
      if (/fail|mistake|wrong|lesson/.test(lower)) {
        return [
          'Early in rolling out our enterprise design system, my biggest mistake was treating it as a <strong>top-down design mandate</strong> instead of a co-owned engineering product.',
          'Engineers bypassed our Figma library because token names didn’t match their repos—so I pivoted to a <strong>federated Design System Guild</strong> and co-built a 3-tier JSON token pipeline.',
          'Adoption jumped above <strong>94% across 45+ squads</strong>, eliminating <strong>$1.8M in UI rework</strong> and shrinking handoff from <strong>4 weeks to 1 day</strong>.'
        ];
      }
      if (/underperform|struggl|difficult designer|coach|pip/.test(lower)) {
        return [
          'When a designer is struggling, I start with <strong>diagnostic empathy</strong> to separate skill gaps from unclear PM requirements—which is how I’ve kept <strong>100% team retention</strong>.',
          'At <strong>Zebra</strong>, I paired a struggling mid-level designer with a senior architect, broke epics into 48-hour check-ins, and coached them with a clear competency rubric.',
          'Within two quarters, their sprint rework dropped to zero and they became our primary owner for rugged Android pairing flows.'
        ];
      }
      if (/leave|leaving|notice|relocat|join|availab/.test(lower)) {
        return [
          'At <strong>IBM Software Labs</strong>, I completed the full cycle of scaling our <strong>14+ designer UX-as-a-Service org</strong> and shipping our flagship <em>watsonx and MaaS360 AI</em> transformations.',
          'I’m now ready for a high-ownership leadership role where I can apply that exact AI and Design System playbook at broader scale.',
          'I have <strong>immediate availability (0-day notice period)</strong> and full flexibility for India or global relocation.'
        ];
      }
      if (/watson|maas360|rhapsody|agentic|confidence|ai/.test(lower)) return PLAYBOOKS[1].blocks;
      if (/carbon|token|design system|handoff/.test(lower)) return PLAYBOOKS[2].blocks;
      if (/ericsson|5g|cpq|excel/.test(lower)) return PLAYBOOKS[3].blocks;
      if (/zebra|handheld|warehouse|glove|iot/.test(lower)) return PLAYBOOKS[4].blocks;
      if (/zf|wabco|truck|cockpit|glance|automotive/.test(lower)) return PLAYBOOKS[5].blocks;
      if (/team|scale|retention|manage|14|ux as a service/.test(lower)) return PLAYBOOKS[6].blocks;
      if (/conflict|pushback|engineer|deadline/.test(lower)) return PLAYBOOKS[7].blocks;
      if (/roi|metric|measure|kpi/.test(lower)) return PLAYBOOKS[8].blocks;
      return PLAYBOOKS[0].blocks;
    }

    async function processLiveInterviewerQuestion(rawText) {
      const clean = (rawText || '').trim();
      if (!clean || clean.length < 3) return;

      heardQuestionLine.textContent = `“${clean}”`;
      questionInput.value = clean;

      // 1. Instant 0ms preview so screen is never blank
      renderBlocksToScreen(pickInstantBlocksForQuestion(clean), '⚡ Thinking...');

      // 2. Groq 120B Ultra-Fast Answer (Strictly 3 short blocks, max 25 words per block!)
      const reqId = ++liveRequestCounter;
      const t0 = performance.now();

      try {
        const sysPrompt = `You are Balaajee V.R.'s live webcam teleprompter.
Write a spoken, first-person ("I...") answer to the interviewer's exact question using Balaajee's real experience:
${targetJobContext ? `TARGET ROLE: ${targetJobContext}\n` : ''}${masterDossier}

CRITICAL TELEPROMPTER RULES FOR ZERO EYE MOVEMENT:
1. Return EXACTLY 3 short, conversational paragraphs in the "blocks" array (total 60 to 80 words maximum across all 3 blocks!).
2. Each block MUST be 1 or 2 short sentences (max 25 words per block) so Balaajee can read it in one glance without moving his eyes.
3. Wrap the 2 or 3 most important phrases/metrics in <strong>...</strong> tags so they glow in gold.
4. Block 1 = Direct answer hook to the exact question. Block 2 = Specific real story at IBM, Zebra, Ericsson, or ZF Wabco. Block 3 = Hard metric outcome.
Return ONLY valid JSON: {"blocks": ["Block 1...", "Block 2...", "Block 3..."]}`;

        const messages = [
          { role: 'system', content: sysPrompt },
          ...conversationHistory.slice(-4),
          { role: 'user', content: clean }
        ];

        const data = await callGroq(messages);
        if (reqId !== liveRequestCounter) return;
        const content = data?.choices?.[0]?.message?.content || '';
        const match = content.match(/\{[\s\S]*\}/);
        if (!match) return;
        const parsed = JSON.parse(match[0]);
        if (Array.isArray(parsed.blocks) && parsed.blocks.length >= 2) {
          const ms = Math.round(performance.now() - t0);
          renderBlocksToScreen(parsed.blocks.slice(0, 3), `⚡ ${ms}ms`);
          conversationHistory.push(
            { role: 'user', content: clean },
            { role: 'assistant', content: parsed.blocks.join(' ') }
          );
        }
      } catch (e) {
        speedBadge.textContent = '⚡ Ready';
      }
    }

    // =========================================================================
    // 5. CONTINUOUS MICROPHONE LISTENER (AUTO-TRIGGERS 0.6s AFTER PAUSE)
    // =========================================================================
    let consumedResultIdx = -1;
    let consumedCharLen = 0;
    let lastObservedRawTranscript = '';

    function initSpeechRecognition() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        alert('Please use Google Chrome or Edge for live speech recognition.');
        return null;
      }
      const rec = new SpeechRec();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = 'en-US';

      rec.onresult = (event) => {
        const currentIdx = event.results.length - 1;
        const latestResult = event.results[currentIdx];
        const rawTranscript = (latestResult[0]?.transcript || '').trim();
        if (!rawTranscript) return;

        if (currentIdx !== consumedResultIdx) {
          consumedResultIdx = currentIdx;
          consumedCharLen = 0;
          lastObservedRawTranscript = '';
        }

        const activeUtterance = rawTranscript.slice(consumedCharLen).trim();
        if (!activeUtterance) return;

        heardQuestionLine.textContent = `Listening: “${activeUtterance}”`;

        if (latestResult.isFinal) {
          clearTimeout(silenceTimer);
          if (activeUtterance.length > 4 && activeUtterance !== lastProcessedQuestion) {
            lastProcessedQuestion = activeUtterance;
            processLiveInterviewerQuestion(activeUtterance);
          }
          consumedCharLen = rawTranscript.length;
          lastObservedRawTranscript = rawTranscript;
          return;
        }

        if (rawTranscript !== lastObservedRawTranscript) {
          lastObservedRawTranscript = rawTranscript;
          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            const freshSlice = rawTranscript.slice(consumedCharLen).trim();
            if (freshSlice.length > 6 && freshSlice !== lastProcessedQuestion) {
              lastProcessedQuestion = freshSlice;
              consumedCharLen = rawTranscript.length;
              processLiveInterviewerQuestion(freshSlice);
            }
          }, 600);
        }
      };

      rec.onend = () => {
        if (isListening) {
          try { rec.start(); } catch (e) {}
        }
      };
      return rec;
    }

    btnToggleMic.addEventListener('click', () => {
      if (!recognition) {
        recognition = initSpeechRecognition();
        if (!recognition) return;
      }
      isListening = !isListening;
      if (isListening) {
        try { recognition.start(); } catch (e) {}
        btnToggleMic.classList.add('active');
        micLabel.textContent = 'Listening...';
        lensDot.classList.add('listening');
      } else {
        try { recognition.stop(); } catch (e) {}
        btnToggleMic.classList.remove('active');
        micLabel.textContent = 'Listen Live';
        lensDot.classList.remove('listening');
      }
    });

    // =========================================================================
    // 6. HEADPHONE / CALL TAB AUDIO CAPTURE (GROQ WHISPER TURBO)
    // =========================================================================
    let tabAudioStream = null;
    let audioCtx = null;
    let analyserNode = null;
    let meterAnimId = null;
    let tabProcessorNode = null;
    const mBars = [
      document.getElementById('mBar1'),
      document.getElementById('mBar2'),
      document.getElementById('mBar3'),
      document.getElementById('mBar4')
    ];

    function updateAudioMeter() {
      if (!analyserNode) return;
      const data = new Uint8Array(analyserNode.frequencyBinCount);
      analyserNode.getByteFrequencyData(data);
      [data[2] || 0, data[6] || 0, data[12] || 0, data[20] || 0].forEach((val, idx) => {
        if (mBars[idx]) mBars[idx].style.height = Math.max(3, Math.min(12, Math.round((val / 255) * 12))) + 'px';
      });
      meterAnimId = requestAnimationFrame(updateAudioMeter);
    }

    function encodeWAV(samples, sampleRate = 16000) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);
      const writeString = (offset, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      };
      writeString(0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, samples.length * 2, true);
      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
      return new Blob([buffer], { type: 'audio/wav' });
    }

    btnHeadphoneMode.addEventListener('click', async () => {
      if (tabAudioStream) {
        tabAudioStream.getTracks().forEach((t) => t.stop());
        tabAudioStream = null;
        if (tabProcessorNode) { try { tabProcessorNode.disconnect(); } catch (e) {} }
        if (meterAnimId) cancelAnimationFrame(meterAnimId);
        btnHeadphoneMode.classList.remove('active');
        headphoneLabel.textContent = 'Headphone Audio';
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        tabAudioStream = stream;
        btnHeadphoneMode.classList.add('active');
        headphoneLabel.textContent = 'Headphone Active';
        heardQuestionLine.textContent = '🎧 Listening to shared call tab audio...';

        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const source = audioCtx.createMediaStreamSource(stream);
        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 64;
        source.connect(analyserNode);
        updateAudioMeter();

        if (stream.getAudioTracks().length > 0) {
          const processor = audioCtx.createScriptProcessor(4096, 1, 1);
          tabProcessorNode = processor;
          let speechChunks = [];
          let totalSamples = 0;
          let speaking = false;
          let silenceFrames = 0;
          let transcribing = false;

          processor.onaudioprocess = async (e) => {
            const input = e.inputBuffer.getChannelData(0);
            let sumSq = 0;
            for (let i = 0; i < input.length; i++) sumSq += input[i] * input[i];
            const rms = Math.sqrt(sumSq / input.length);

            if (rms > 0.012) {
              speaking = true;
              silenceFrames = 0;
              speechChunks.push(new Float32Array(input));
              totalSamples += input.length;
            } else if (speaking) {
              silenceFrames++;
              speechChunks.push(new Float32Array(input));
              totalSamples += input.length;

              if (silenceFrames >= 3 || totalSamples >= 16000 * 6) {
                speaking = false;
                silenceFrames = 0;
                const capturedSamples = totalSamples;
                const chunksToProcess = speechChunks;
                speechChunks = [];
                totalSamples = 0;

                if (capturedSamples > 16000 * 0.8 && !transcribing) {
                  transcribing = true;
                  try {
                    const merged = new Float32Array(capturedSamples);
                    let offset = 0;
                    for (const c of chunksToProcess) {
                      merged.set(c, offset);
                      offset += c.length;
                    }
                    const wavBlob = encodeWAV(merged, 16000);
                    const formData = new FormData();
                    formData.append('file', wavBlob, 'q.wav');
                    formData.append('model', 'whisper-large-v3-turbo');
                    formData.append('language', 'en');
                    const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                      method: 'POST',
                      headers: { 'Authorization': `Bearer ${groqApiKey}` },
                      body: formData
                    });
                    if (res.ok) {
                      const d = await res.json();
                      const text = (d.text || '').trim();
                      if (text && text.length > 5 && text !== lastProcessedQuestion) {
                        lastProcessedQuestion = text;
                        processLiveInterviewerQuestion(text);
                      }
                    }
                  } catch (err) {}
                  finally { transcribing = false; }
                }
              }
            }
          };
          source.connect(processor);
          processor.connect(audioCtx.destination);
        }
      } catch (err) {
        heardQuestionLine.textContent = 'Select your Meet/Zoom tab and check "Also share tab audio"';
      }
    });

    // =========================================================================
    // 7. 1-CLICK SPOKEN AI HIRING MANAGER (SPEAKS ALOUD + ANSWERS INSTANTLY)
    // =========================================================================
    const MOCK_QUESTIONS = [
      'Walk me through how you scaled 14+ designers into a UX-as-a-Service organization at IBM and Zebra while keeping 100% retention.',
      'At IBM Software Labs, enterprise architects often distrust generative AI. How did your 3-tier confidence gating and blast-radius preview work?',
      'Tell me about a time Engineering pushed back against your UX design because of tight sprint deadlines. How did you resolve it?',
      'At Ericsson Global, how did you replace a 14-tab Excel workbook across 45 countries and cut quote turnaround from 6 days to 42 minutes?',
      'Tell me about a time a designer on your team was underperforming. How did you coach them and turn that around?',
      'At Zebra Technologies, how did field research in cold-storage warehouses shape your gloved-touch UX across 38,000 handhelds?',
      'Why are you looking to transition from IBM, and what would your first 90 days look like in this role?'
    ];
    let mockIdx = 0;
    let lastMockQuestion = '';

    function speakAndAnswerMockQuestion(qText) {
      lastMockQuestion = qText;
      processLiveInterviewerQuestion(qText);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(qText);
        utter.rate = 1.02;
        window.speechSynthesis.speak(utter);
      }
    }

    document.getElementById('btnMockAskQuestion').addEventListener('click', () => {
      const q = MOCK_QUESTIONS[mockIdx % MOCK_QUESTIONS.length];
      mockIdx++;
      speakAndAnswerMockQuestion(q);
    });

    document.getElementById('btnMockFollowUp').addEventListener('click', async () => {
      const prev = lastMockQuestion || questionInput.value || 'your AI and Design System leadership at IBM';
      speedBadge.textContent = '🤖 Thinking...';
      try {
        const d = await callGroq([
          {
            role: 'system',
            content: 'You are a Hiring Manager interviewing Balaajee V.R. Ask ONE short 1-sentence follow-up question drilling into the previous topic. Return ONLY JSON: {"q":"..."}'
          },
          { role: 'user', content: `Previous question: "${prev}"` }
        ], 'openai/gpt-oss-20b');
        const parsed = JSON.parse(d.choices[0].message.content);
        if (parsed.q) {
          speakAndAnswerMockQuestion(parsed.q);
          return;
        }
      } catch (e) {}
      speakAndAnswerMockQuestion('How did you measure the business impact of that, and what would you do differently next time?');
    });

    // =========================================================================
    // 8. SCROLL, FONT SIZE & KEYBOARD SHORTCUTS
    // =========================================================================
    function updateActiveBlockOnScroll() {
      const blocks = answerStream.querySelectorAll('.answer-block');
      const scrollY = readingStage.scrollTop + 80;
      let active = blocks[0];
      blocks.forEach((b) => {
        if (b.offsetTop <= scrollY) active = b;
        b.classList.remove('active-block');
      });
      if (active) active.classList.add('active-block');
    }

    function stepScroll() {
      if (!isScrolling) return;
      scrollAccum += scrollSpeed * 0.38;
      if (scrollAccum >= 1) {
        const px = Math.floor(scrollAccum);
        readingStage.scrollTop += px;
        scrollAccum -= px;
        updateActiveBlockOnScroll();
      }
      animFrameId = requestAnimationFrame(stepScroll);
    }

    function toggleScroll() {
      isScrolling = !isScrolling;
      if (isScrolling) {
        btnPlayPause.textContent = '⏸ Pause (Space)';
        btnPlayPause.classList.add('playing');
        animFrameId = requestAnimationFrame(stepScroll);
      } else {
        btnPlayPause.textContent = '▶ Scroll (Space)';
        btnPlayPause.classList.remove('playing');
        if (animFrameId) cancelAnimationFrame(animFrameId);
      }
    }

    btnPlayPause.addEventListener('click', toggleScroll);
    readingStage.addEventListener('scroll', updateActiveBlockOnScroll, { passive: true });

    document.getElementById('btnFontDown').addEventListener('click', () => {
      fontSizePx = Math.max(22, fontSizePx - 3);
      document.documentElement.style.setProperty('--prompt-size', fontSizePx + 'px');
    });
    document.getElementById('btnFontUp').addEventListener('click', () => {
      fontSizePx = Math.min(44, fontSizePx + 3);
      document.documentElement.style.setProperty('--prompt-size', fontSizePx + 'px');
    });

    document.getElementById('btnAskNow').addEventListener('click', () => {
      const v = questionInput.value.trim();
      if (v) processLiveInterviewerQuestion(v);
    });
    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const v = questionInput.value.trim();
        if (v) processLiveInterviewerQuestion(v);
      }
    });

    // Brain Modal
    const brainModal = document.getElementById('brainModal');
    const targetJobInput = document.getElementById('targetJobInput');
    const masterDossierInput = document.getElementById('masterDossierInput');
    const groqKeyInput = document.getElementById('groqKeyInput');

    document.getElementById('btnOpenBrain').addEventListener('click', () => {
      targetJobInput.value = targetJobContext;
      masterDossierInput.value = masterDossier;
      groqKeyInput.value = groqApiKey;
      brainModal.classList.add('open');
    });
    document.getElementById('btnCloseBrainModal').addEventListener('click', () => brainModal.classList.remove('open'));
    document.getElementById('btnSaveBrain').addEventListener('click', () => {
      targetJobContext = targetJobInput.value.trim();
      masterDossier = masterDossierInput.value.trim() || DEFAULT_BALAAJEE_DOSSIER;
      groqApiKey = groqKeyInput.value.trim() || decodePreloadedKey();
      localStorage.setItem(STORAGE_KEY_TARGET_JD, targetJobContext);
      localStorage.setItem(STORAGE_KEY_DOSSIER, masterDossier);
      localStorage.setItem(STORAGE_KEY_GROQ, groqApiKey);
      brainModal.classList.remove('open');
    });

    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) {
        if (e.key === 'Escape') document.activeElement.blur();
        return;
      }
      if (e.code === 'Space') {
        e.preventDefault();
        toggleScroll();
      } else if (e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        readingStage.scrollTop = 0;
        updateActiveBlockOnScroll();
      } else {
        const pb = PLAYBOOKS.find((p) => p.key === e.key);
        if (pb) {
          e.preventDefault();
          activePlaybookId = pb.id;
          heardQuestionLine.textContent = pb.label;
          renderBlocksToScreen(pb.blocks, '⚡ Ready');
        }
      }
    });

    // Boot with Playbook 01
    renderBlocksToScreen(PLAYBOOKS[0].blocks, '⚡ Groq 120B Ready');
  </script>
