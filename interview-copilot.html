<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Balaajee V.R. • Zero-Eye-Movement Interview Teleprompter</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-void: #04070E;
      --bg-dock: #0C1322;
      --border-subtle: rgba(148, 163, 184, 0.16);
      --text-primary: #FFFFFF;
      --accent-gold: #FBBF24;
      --accent-cyan: #38BDF8;
      --accent-emerald: #10B981;
      --accent-rose: #F43F5E;
      --accent-purple: #A855F7;
      --prompt-size: 25px;
      --column-width: 720px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-void);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-layout {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* =========================================================================
       1. TOP WEBCAM READING ZONE (NARROW 650px COLUMN RIGHT UNDER CAMERA!)
       ========================================================================= */
    .webcam-reading-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      padding: 8px 20px 140px;
      scroll-behavior: auto;
    }

    .webcam-reading-stage::-webkit-scrollbar {
      width: 5px;
    }

    .webcam-reading-stage::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 999px;
    }

    .narrow-eye-column {
      width: 100%;
      max-width: var(--column-width);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* LIVE TELEMETRY & STATUS BAR RIGHT UNDER WEBCAM */
    .live-telemetry-bar {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 12px;
      padding: 8px 14px;
      transition: all 0.2s ease;
    }

    .live-telemetry-bar.state-hearing {
      border-color: var(--accent-rose);
      background: rgba(244, 63, 94, 0.14);
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.22);
    }

    .live-telemetry-bar.state-thinking {
      border-color: var(--accent-gold);
      background: rgba(251, 191, 36, 0.14);
    }

    .telemetry-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .state-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      color: #E2E8F0;
    }

    .state-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 10px var(--accent-emerald);
      flex-shrink: 0;
    }

    .state-dot.hearing {
      background: var(--accent-rose);
      box-shadow: 0 0 12px var(--accent-rose);
      animation: pulse 0.6s infinite ease-in-out;
    }

    .state-dot.thinking {
      background: var(--accent-gold);
      box-shadow: 0 0 12px var(--accent-gold);
      animation: pulse 0.4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.55; }
    }

    .mic-level-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 150px;
    }

    .mic-level-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #94A3B8;
      white-space: nowrap;
    }

    .mic-level-track {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    .mic-level-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-emerald), var(--accent-gold), var(--accent-rose));
      border-radius: 999px;
      transition: width 0.05s linear;
    }

    .btn-pause-read {
      background: rgba(56, 189, 248, 0.14);
      color: #7DD3FC;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .btn-pause-read.locked {
      background: var(--accent-emerald);
      color: #04070E;
      border-color: var(--accent-emerald);
      font-weight: 800;
    }

    .btn-force-answer {
      background: var(--accent-gold);
      color: #04070E;
      border: none;
      border-radius: 999px;
      padding: 5px 13px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.1s ease;
    }

    .btn-force-answer:hover {
      transform: scale(1.04);
    }

    .heard-question-line {
      font-size: 12.5px;
      color: var(--accent-cyan);
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pause-progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
    }

    .pause-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-cyan);
      transition: width 0.08s linear;
    }

    /* THE TOP ACTIVE ANSWER ZONE — PINNED RIGHT UNDER WEBCAM SO EYES NEVER DROP DOWN */
    .answer-stream {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 0px;
    }

    .latest-turn-card {
      display: flex;
      flex-direction: column;
      gap: 7px;
      background: rgba(15, 23, 42, 0.72);
      border: 1.5px solid rgba(251, 191, 36, 0.45);
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }

    .latest-question-bubble {
      align-self: flex-start;
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.38);
      color: #BAE6FD;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.32;
      padding: 5px 12px;
      border-radius: 12px 12px 12px 3px;
      max-width: 96%;
    }

    .latest-question-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--accent-cyan);
      letter-spacing: 0.04em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Fixed Eye-Level Viewport (max 4 lines tall right under camera so eyes NEVER drop to middle of screen!) */
    .answer-block {
      font-size: var(--prompt-size);
      line-height: 1.35;
      font-weight: 700;
      color: #FFFFFF;
      padding: 10px 15px;
      border-radius: 14px 14px 3px 14px;
      background: rgba(251, 191, 36, 0.08);
      border-left: 4px solid var(--accent-gold);
      max-height: 205px;
      overflow-y: auto;
      scroll-behavior: smooth;
      transition: all 0.2s ease;
    }

    .answer-block::-webkit-scrollbar {
      width: 5px;
    }

    .answer-block::-webkit-scrollbar-thumb {
      background: rgba(251, 191, 36, 0.45);
      border-radius: 999px;
    }

    .answer-block strong {
      color: var(--accent-gold);
      font-weight: 800;
    }

    .answer-block em {
      color: var(--accent-cyan);
      font-style: normal;
      font-weight: 800;
    }

    .eye-zone-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #94A3B8;
      padding: 0 2px;
    }

    .shield-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #6EE7B7;
      font-weight: 700;
    }

    .teleprompter-nudge-btns {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-nudge {
      background: rgba(255, 255, 255, 0.07);
      color: #E2E8F0;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-nudge:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    /* PREVIOUS Q&A CHAT BUBBLE THREAD BELOW */
    .chat-history-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
      padding-top: 10px;
      border-top: 1px dashed rgba(148, 163, 184, 0.22);
    }

    .chat-history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .chat-history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-turn-pair {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(12, 19, 34, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 14px;
      padding: 10px 13px;
    }

    .bubble-interviewer {
      align-self: flex-start;
      background: rgba(56, 189, 248, 0.11);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: #E0F2FE;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.35;
      padding: 6px 11px;
      border-radius: 12px 12px 12px 3px;
      max-width: 92%;
    }

    .bubble-interviewer .b-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 800;
      color: var(--accent-cyan);
      display: block;
      margin-bottom: 2px;
    }

    .bubble-candidate {
      align-self: flex-end;
      background: rgba(16, 185, 129, 0.09);
      border: 1px solid rgba(16, 185, 129, 0.28);
      color: #F1F5F9;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      padding: 8px 13px;
      border-radius: 12px 12px 3px 12px;
      max-width: 95%;
    }

    .bubble-candidate strong {
      color: var(--accent-gold);
      font-weight: 800;
    }

    .bubble-candidate .b-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 800;
      color: var(--accent-emerald);
      display: block;
      margin-bottom: 2px;
    }

    @keyframes flashNewAnswer {
      0% { transform: translateY(-4px); opacity: 0.4; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .answer-stream.fresh-update {
      animation: flashNewAnswer 0.22s ease-out;
    }

    /* =========================================================================
       2. SUBTLE BOTTOM CONTROL DOCK
       ========================================================================= */
    .bottom-dock-wrapper {
      flex-shrink: 0;
      background: rgba(12, 19, 34, 0.96);
      border-top: 1px solid var(--border-subtle);
      padding: 8px 16px;
    }

    .bottom-dock {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .dock-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .dock-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: #131E36;
      color: #E2E8F0;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .dock-btn:hover {
      border-color: var(--accent-cyan);
      color: #FFFFFF;
    }

    .dock-btn.btn-mic {
      border-color: rgba(16, 185, 129, 0.5);
      background: rgba(16, 185, 129, 0.15);
      color: #6EE7B7;
    }

    .dock-btn.btn-mic.active {
      background: rgba(244, 63, 94, 0.25);
      border-color: var(--accent-rose);
      color: #FFFFFF;
      box-shadow: 0 0 14px rgba(244, 63, 94, 0.35);
    }

    .mic-device-select {
      background: #080E1C;
      color: #7DD3FC;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 600;
      max-width: 195px;
      outline: none;
      cursor: pointer;
    }

    .dock-btn.btn-headphone.active {
      background: rgba(56, 189, 248, 0.24);
      border-color: var(--accent-cyan);
      color: #FFFFFF;
    }

    .dock-btn.btn-mock {
      border-color: rgba(168, 85, 247, 0.5);
      background: rgba(168, 85, 247, 0.16);
      color: #E9D5FF;
    }

    .dock-input-wrap {
      flex: 1;
      min-width: 180px;
      display: flex;
      align-items: center;
      position: relative;
    }

    .dock-input {
      width: 100%;
      background: #060A14;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 6px 70px 6px 13px;
      color: #FFFFFF;
      font-size: 12.5px;
      outline: none;
    }

    .dock-input:focus {
      border-color: var(--accent-cyan);
    }

    .btn-dock-ask {
      position: absolute;
      right: 4px;
      background: var(--accent-gold);
      color: #04070E;
      border: none;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .hotkey-strip {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .hotkey-strip::-webkit-scrollbar {
      display: none;
    }

    .hk-pill {
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.14);
      background: rgba(15, 23, 42, 0.7);
      color: #94A3B8;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .hk-pill.active, .hk-pill:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 14, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #0C1322;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      width: 100%;
      max-width: 680px;
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      border-bottom: 1px solid var(--border-subtle);
      font-weight: 800;
      font-size: 14px;
    }

    .modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13px;
      color: #CBD5E1;
    }

    .modal-textarea, .modal-input {
      width: 100%;
      background: #050811;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 9px 12px;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
    }

    .modal-textarea {
      min-height: 120px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 11px 18px;
      border-top: 1px solid var(--border-subtle);
    }

    .btn-save {
      background: var(--accent-emerald);
      color: #04070E;
      border: none;
      border-radius: 8px;
      padding: 7px 15px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- =====================================================================
         1. TOP WEBCAM READING ZONE (NARROW 650px COLUMN RIGHT UNDER CAMERA)
         ===================================================================== -->
    <main class="webcam-reading-stage" id="readingStage">
      <div class="narrow-eye-column">
        <!-- LIVE TELEMETRY BAR -->
        <div class="live-telemetry-bar" id="telemetryBar">
          <div class="telemetry-top-row">
            <div class="state-pill">
              <span class="state-dot" id="stateDot"></span>
              <span id="stateText">READY • Click "🎙️ Listen Live" below</span>
            </div>

            <div class="mic-level-wrap" title="Live Microphone Signal Level">
              <span class="mic-level-label">Mic Vol:</span>
              <div class="mic-level-track">
                <div class="mic-level-fill" id="micLevelFill"></div>
              </div>
            </div>

            <div style="display:flex; align-items:center; gap:6px;">
              <button type="button" class="btn-pause-read" id="btnPauseWhileReading" title="Press Spacebar to lock/unlock the screen while you read your answer out loud">
                ⏸️ Lock While Reading (Space)
              </button>
              <button type="button" class="btn-force-answer" id="btnForceAnswerNow" title="Transcribes the last 6 seconds of audio & answers immediately!">
                ⚡ Answer Now (Enter)
              </button>
            </div>
          </div>

          <div class="heard-question-line" id="heardQuestionLine">
            👂 Question heard will appear here live...
          </div>

          <div class="pause-progress-track">
            <div class="pause-progress-fill" id="pauseProgressFill"></div>
          </div>
        </div>

        <!-- 1A. LATEST ANSWER BUBBLE (Pinned right under your webcam so your eyes NEVER drop down!) -->
        <div class="answer-stream" id="answerStream"></div>

        <!-- 1B. PREVIOUS Q&A CHAT BUBBLES (Scrollable chat history below the latest answer) -->
        <div class="chat-history-section" id="chatHistorySection" style="display:none;">
          <div class="chat-history-header">
            <span id="chatHistoryCountLabel">💬 Previous Q&A Chat History (0)</span>
            <button type="button" class="btn-nudge" id="btnClearHistory" title="Clear previous Q&A chat history">Clear History</button>
          </div>
          <div class="chat-history-list" id="chatHistoryList"></div>
        </div>
      </div>
    </main>

    <!-- =====================================================================
         2. COMPACT BOTTOM CONTROL DOCK
         ===================================================================== -->
    <footer class="bottom-dock-wrapper">
      <div class="bottom-dock">
        <div class="dock-row">
          <button type="button" class="dock-btn btn-mic" id="btnToggleMic">
            <span>🎙️</span>
            <span id="micLabel">Listen Live</span>
          </button>

          <!-- MICROPHONE SELECTOR (Automatically picks MacBook Pro Mic instead of Bluetooth Earbuds!) -->
          <select id="micDeviceSelect" class="mic-device-select" title="Select MacBook Pro Microphone so it hears your phone & room clearly even while wearing Airdopes!">
            <option value="">🎤 Auto (MacBook Mic)</option>
          </select>

          <button type="button" class="dock-btn btn-headphone" id="btnHeadphoneMode" title="Listens ONLY to Interviewer Speaker Audio from a Chrome Tab (Google Meet / Zoom / Teams / Gemini Web) — completely ignores your microphone!">
            <span>🔊</span>
            <span id="headphoneLabel">Interviewer Speaker Only (Tab)</span>
          </button>

          <button type="button" class="dock-btn btn-mock" id="btnMockAskQuestion" title="Built-in AI Hiring Manager speaks a question out loud">
            <span>🤖🔊</span>
            <span>Mock Q</span>
          </button>

          <button type="button" class="dock-btn btn-mock" id="btnMockFollowUp" title="Built-in AI Hiring Manager asks a follow-up">
            <span>🔄</span>
            <span>Follow-Up</span>
          </button>

          <div class="dock-input-wrap">
            <input
              type="text"
              id="questionInput"
              class="dock-input"
              placeholder="Or type question & press Enter..."
              autocomplete="off"
            />
            <button type="button" class="btn-dock-ask" id="btnAskNow">Ask ↵</button>
          </div>

          <button type="button" class="dock-btn" id="btnFontDown" title="Smaller text">A-</button>
          <button type="button" class="dock-btn" id="btnFontUp" title="Larger text">A+</button>
          <button type="button" class="dock-btn" id="btnOpenBrain" title="Edit Balaajee Brain & Target JD">🧠 Brain</button>
        </div>

        <div class="hotkey-strip" id="hotkeyStrip" style="display:none;"></div>
      </div>
    </footer>
  </div>

  <!-- BRAIN & TARGET JD MODAL -->
  <div class="modal-backdrop" id="brainModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>🧠 Balaajee V.R. Brain, Target Job & Groq Key</span>
        <button type="button" class="dock-btn" id="btnCloseBrainModal">✕</button>
      </div>
      <div class="modal-body">
        <div>
          <label style="font-size:11px; font-weight:700; color:var(--accent-gold); display:block; margin-bottom:4px;">TARGET COMPANY & JOB DESCRIPTION (OPTIONAL)</label>
          <textarea id="targetJobInput" class="modal-textarea" style="min-height:70px;" placeholder="e.g., ServiceNow — Director of Product Design (Enterprise AI)."></textarea>
        </div>
        <div>
          <label style="font-size:11px; font-weight:700; color:var(--accent-gold); display:block; margin-bottom:4px;">BALAAJEE V.R. MASTER DOSSIER (PRE-LOADED)</label>

    const STOP_WORDS = new Set([
      'that','this','with','from','have','your','about','were','what','when','where','which','while',
      'into','through','their','there','been','would','could','should','them','they','then','than',
      'also','more','most','some','such','only','other','over','under','after','before','between'

    function extractContentWords(str) {
      return (str || '')
        .toLowerCase()
        .replace(/<[^>]+>/g, ' ')
        .replace(/[^a-z0-9\s]/g, ' ')
        .split(/\s+/)
        .filter((w) => w.length >= 4 && !STOP_WORDS.has(w));

    function isCandidateReadingOwnAnswer(spokenText) {
      if (isReadingLockActive) return true;
      const clean = (spokenText || '').trim();
      if (!clean || clean.length < 5) return true;

      // 0. 5.5-Second Stabilization Shield right after a new answer appears on screen:
      //    Prevents the answer from suddenly changing 1-2 seconds after you start reading it!
      if (lastAnswerRenderedAt > 0 && (performance.now() - lastAnswerRenderedAt) < READING_SHIELD_MS) {
        return true;

      // 1. If the utterance starts with first-person candidate pronouns ("I ...", "My ...", "We ...", "At IBM I...")
      //    it is ALWAYS Balaajee speaking his answer!
      if (/^(i\b|i'm\b|i’m\b|i've\b|i’ve\b|my\b|in my\b|we\b|our\b|at ibm,? i\b|at zebra,? i\b|at ericsson,? i\b)/i.test(clean)) {
        return true;
      }

      // 2. If the utterance contains explicit INTERVIEWER question / second-person markers ("you", "your", "tell me", "how", "?")
      //    and does NOT start with "I / My", it is 100% the INTERVIEWER asking a question (even if it mentions words on screen)!
      const hasInterviewerQuestionMarker =
        clean.includes('?') ||
        /\b(you|your|yours|yourself|tell me|walk me|can you|could you|would you|do you|did you|have you|how|what|why|when|where|who|which|describe|explain|elaborate|share|give|discuss|talk about|go deeper)\b/i.test(clean);

      if (hasInterviewerQuestionMarker && !/\b(i built|i led|i designed|i architected|i scaled|i replaced|i organized)\b/i.test(clean)) {
        return false;
      }

      // 3. Otherwise, check word overlap against the answer currently displayed on the teleprompter screen
      if (currentDisplayedAnswerPlain && currentDisplayedAnswerPlain.length > 20) {
        const answerWordSet = new Set(extractContentWords(currentDisplayedAnswerPlain));
        const spokenWords = extractContentWords(clean);
        if (spokenWords.length >= 2 && answerWordSet.size > 0) {
          let matchCount = 0;
          for (const w of spokenWords) {
            if (answerWordSet.has(w)) matchCount++;
          }
          const overlapRatio = matchCount / spokenWords.length;
          if ((matchCount >= 2 && overlapRatio >= 0.40) || matchCount >= 5) {
            return true;
          }
        }
      }

      return false;
    }

    // =========================================================================
    // 4. GROQ 120B ANSWER GENERATOR — ULTRA-COMPACT 2-SENTENCE EYE-LEVEL ANSWERS
    // =========================================================================
    async function callGroq(messages, modelName = 'openai/gpt-oss-120b') {
      const payload = {
        model: modelName,
        temperature: 0.25,
        max_tokens: 600,
        response_format: { type: 'json_object' },
        messages
      };
      if (modelName.startsWith('openai/gpt-oss')) payload.reasoning_effort = 'low';

      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${groqApiKey}`
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        if (modelName === 'openai/gpt-oss-120b') return callGroq(messages, 'openai/gpt-oss-20b');
        if (modelName === 'openai/gpt-oss-20b') return callGroq(messages, 'qwen/qwen3.8-27b');
        throw new Error(`HTTP ${res.status}`);
      }
      return res.json();
    }

    function recordCandidateSpokenMemory(spokenChunk) {
      const text = (spokenChunk || '').trim();
      if (!text || text.length < 6) return;
      if (!candidateSpokenNotes.includes(text)) {
        candidateSpokenNotes = ((candidateSpokenNotes ? candidateSpokenNotes + ' ' : '') + text).slice(-450);
      }
    }

    async function processLiveInterviewerQuestion(rawText, isManualInput = false) {
      const clean = (rawText || '').trim();
      if (!clean || clean.length < 3) return;

      // If this came from live voice (not manual typing/button) and matches Balaajee reading/speaking his own answer
      // OR falls inside the 5.5s post-answer Reading Stabilization Shield:
      if (!isManualInput && isCandidateReadingOwnAnswer(clean)) {
        recordCandidateSpokenMemory(clean);
        setTelemetryState('ready', '🛡️ Reading Shield: Locked on your current answer • Waiting for next interviewer question...');
        return;
      }

      heardQuestionLine.textContent = `🎤 Interviewer Question: “${clean}”`;
      questionInput.value = clean;
      pauseProgressFill.style.width = '0%';
      setTelemetryState('thinking', '🧠 Generating concise 3-line answer right under your camera...');

      const reqId = ++liveRequestCounter;
      const t0 = performance.now();

      try {
        const sysPrompt = `You are Balaajee V.R.'s live interview teleprompter.
Write ONE ultra-concise, natural first-person ("I...") spoken answer that directly answers ONLY the exact question asked below.

BALAAJEE'S BACKGROUND (use ONLY if directly relevant to this specific question; do NOT force unrelated company stories):
${targetJobContext ? `TARGET ROLE: ${targetJobContext}\n` : ''}${masterDossier}

PREVIOUS TURN FOLLOW-UP MEMORY (Use ONLY if the interviewer's new question is a follow-up referring to Balaajee's previous answer, e.g. "Can you elaborate on that?", "How did you measure that?". If the interviewer is asking a new topic, ignore this previous turn completely):
- Previous Interviewer Question: "${previousInterviewerQuestion || 'None'}"
- Previous Answer Shown: "${currentDisplayedAnswerPlain || 'None'}"
- Extra Details Spoken by Balaajee: "${candidateSpokenNotes || 'Same as above'}"

STRICT EYE-CONTACT & LENGTH RULES:
1. Keep the answer to strictly 2 short, punchy sentences (25 to 40 words MAXIMUM) so it fits inside 3 lines right under the webcam and Balaajee NEVER has to move his eyes down to the middle of the screen!
2. Answer ONLY the exact question asked. Highlight 2 or 3 key phrases/metrics in <strong>...</strong> tags so they glow in gold.
Return ONLY valid JSON: {"blocks": ["Your 2-sentence (25-40 words max) direct spoken answer..."]}`;

        const messages = [
          { role: 'system', content: sysPrompt },
          { role: 'user', content: `Interviewer Question: "${clean}"` }
        ];

        const data = await callGroq(messages);
        if (reqId !== liveRequestCounter) return;
        const content = data?.choices?.[0]?.message?.content || '';
        const match = content.match(/\{[\s\S]*\}/);
        let unifiedAnswer = '';
        if (match) {
          const parsed = JSON.parse(match[0]);
          if (Array.isArray(parsed.blocks) && parsed.blocks.length >= 1) {
            unifiedAnswer = parsed.blocks.join(' ');
          } else if (typeof parsed.answer === 'string') {
            unifiedAnswer = parsed.answer;
          }
        }
        if (!unifiedAnswer) {
          unifiedAnswer = pickFallbackAnswerForQuestion(clean);
        }

        const ms = Math.round(performance.now() - t0);
        heardQuestionLine.textContent = `🎤 Interviewer Question: “${clean}”`;
        questionInput.value = clean;
        previousInterviewerQuestion = clean;
        candidateSpokenNotes = '';
        renderBlocksToScreen([unifiedAnswer], true, clean);
        setTelemetryState(
          'ready',
          isTabSpeakerOnlyMode
            ? `🟢 Answer Ready (${ms}ms) • Speaker-Only Mode (Your Mic is 100% OFF)`
            : isMicActive
              ? `🟢 Answer Ready (${ms}ms) • 5.5s Reading Shield Active (Won't switch while you read)`
              : `🟢 Answer Ready (${ms}ms)`
        );
      } catch (e) {
        if (reqId !== liveRequestCounter) return;
        const fallback = pickFallbackAnswerForQuestion(clean);
        previousInterviewerQuestion = clean;
        candidateSpokenNotes = '';
        renderBlocksToScreen([fallback], true, clean);
        setTelemetryState('ready', isMicActive ? '🟢 Answer Ready • Listening for next question...' : '🟢 Answer Ready');
      }
    }

    // =========================================================================
    // 5. NEVER-STUCK AUTO-VOICE CAPTURE (PEAK-RELATIVE VAD + QUEUED WHISPER)
    //    - Single unified Whisper trigger (NO competing WebSpeech double-trigger!)
    //    - 1.15s pause window so interviewer mid-sentence breaths don't split a question
    // =========================================================================
    let isMicActive = false;
    let micStream = null;
    let micAudioCtx = null;
    let micProcessor = null;
    let selectedMicDeviceId = '';

    const TARGET_SAMPLE_RATE = 16000;
    let rollingPcm16k = new Float32Array(0);
    let speechPcm16k = [];
    let isSpeakingNow = false;
    let speechStartedAt = 0;
    let silenceStartedAt = 0;
    let utterancePeakRms = 0;
    let ambientRms = 0.002;
    let isTranscribingWhisper = false;
    let pendingWhisperSamples = null;
    let webSpeechRec = null;
    let lastTranscriptTime = 0;

    async function populateMicDevices() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioInputs = devices.filter((d) => d.kind === 'audioinput');
        if (!audioInputs.length) return;

        micDeviceSelect.innerHTML = '';
        let preferredBuiltInId = '';

        audioInputs.forEach((dev, idx) => {
          const opt = document.createElement('option');
          opt.value = dev.deviceId;
          const label = dev.label || `Microphone ${idx + 1}`;
          opt.textContent = `🎤 ${label}`;
          micDeviceSelect.appendChild(opt);

          // Automatically prefer MacBook Pro Built-in Mic over Bluetooth earbuds (Airdopes/AirPods)
          if (/macbook|built-in|internal/i.test(label) && !preferredBuiltInId) {
            preferredBuiltInId = dev.deviceId;
          }
        });

        if (preferredBuiltInId && !selectedMicDeviceId) {
          selectedMicDeviceId = preferredBuiltInId;
          micDeviceSelect.value = preferredBuiltInId;
        } else if (selectedMicDeviceId) {
          micDeviceSelect.value = selectedMicDeviceId;
        }
      } catch (e) {}
    }

    micDeviceSelect.addEventListener('change', () => {
      selectedMicDeviceId = micDeviceSelect.value;
      if (isMicActive) {
        stopLiveMicrophone();
        setTimeout(startLiveMicrophone, 150);
      }
    });

    // Downsample arbitrary AudioContext rate (e.g., 48000Hz) to 16000Hz Float32Array
    function downsampleTo16k(buffer, inputSampleRate) {
      if (inputSampleRate === TARGET_SAMPLE_RATE) return new Float32Array(buffer);
      const ratio = inputSampleRate / TARGET_SAMPLE_RATE;
      const newLen = Math.round(buffer.length / ratio);
      const result = new Float32Array(newLen);
      let offsetResult = 0;
      let offsetBuffer = 0;
      while (offsetResult < result.length) {
        const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
        let accum = 0;
        let count = 0;
        for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
          accum += buffer[i];
          count++;
        }
        result[offsetResult] = count > 0 ? accum / count : 0;
        offsetResult++;
        offsetBuffer = nextOffsetBuffer;
      }
      return result;
    }

    // Peak-normalize & encode 16kHz Float32Array into a standard 16-bit mono WAV Blob
    function encodePeakNormalizedWAV(samples16k) {
      let peak = 0;
      for (let i = 0; i < samples16k.length; i++) {
        const abs = Math.abs(samples16k[i]);
        if (abs > peak) peak = abs;
      }
      const gain = peak > 0.001 ? Math.min(20.0, 0.85 / peak) : 1.0;

      const buffer = new ArrayBuffer(44 + samples16k.length * 2);
      const view = new DataView(buffer);
      const writeStr = (off, s) => {
        for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i));
      };
      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + samples16k.length * 2, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, 1, true); // Mono
      view.setUint32(24, TARGET_SAMPLE_RATE, true);
      view.setUint32(28, TARGET_SAMPLE_RATE * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, samples16k.length * 2, true);

      let offset = 44;
      for (let i = 0; i < samples16k.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, samples16k[i] * gain));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
      return new Blob([view], { type: 'audio/wav' });
    }

    async function sendPcmSamplesToGroqWhisper(samples16k, isManualForce = false) {
      if (!samples16k || samples16k.length < TARGET_SAMPLE_RATE * 0.35) return;

      // If we are inside the 5.5s post-answer Reading Stabilization Shield (and user didn't click Answer Now),
      // ignore background audio so the answer NEVER changes 1-2s after you start reading!
      if (!isManualForce && lastAnswerRenderedAt > 0 && (performance.now() - lastAnswerRenderedAt) < READING_SHIELD_MS) {
        return;
      }

      if (isTranscribingWhisper) {
        pendingWhisperSamples = samples16k;
        return;
      }

      isTranscribingWhisper = true;
      setTelemetryState('thinking', '⚡ Transcribing interviewer question via Groq Whisper Turbo...');

      let transcribedQuestion = '';
      try {
        const wavBlob = encodePeakNormalizedWAV(samples16k);
        const formData = new FormData();
        formData.append('file', wavBlob, 'speech.wav');
        formData.append('model', 'whisper-large-v3-turbo');
        formData.append('language', 'en');

        const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${groqApiKey}` },
          body: formData
        });

        if (res.ok) {
          const data = await res.json();
          const whisperText = (data.text || '').replace(/\[.*?\]|\(.*?\)/g, '').trim();
          const isHallucination = /^(thank you\.?|thanks for watching\.?|you\.?|bye\.?|okay\.?|subtitles.*|\.+)$/i.test(whisperText);

          if (whisperText && whisperText.length > 4 && !isHallucination) {
            transcribedQuestion = whisperText;
          }
        }
      } catch (err) {
        // Ignore network glitch and keep listening
      } finally {
        isTranscribingWhisper = false;
      }

      if (pendingWhisperSamples) {
        const nextSamples = pendingWhisperSamples;
        pendingWhisperSamples = null;
        sendPcmSamplesToGroqWhisper(nextSamples, isManualForce);
        return;
      }

      if (transcribedQuestion) {
        const now = performance.now();
        if (isManualForce || transcribedQuestion !== lastProcessedQuestion || now - lastTranscriptTime > 3000) {
          lastProcessedQuestion = transcribedQuestion;
          lastTranscriptTime = now;
          processLiveInterviewerQuestion(transcribedQuestion, isManualForce);
        }
      } else {
        setTelemetryState('ready', '🟢 Listening for next interviewer question...');
      }
    }

    function flushActiveSpeechToWhisper() {
      isSpeakingNow = false;
      silenceStartedAt = 0;
      utterancePeakRms = 0;
      pauseProgressFill.style.width = '0%';

      if (!speechPcm16k.length) return;
      const totalLen = speechPcm16k.reduce((acc, c) => acc + c.length, 0);
      const merged = new Float32Array(totalLen);
      let off = 0;
      for (const c of speechPcm16k) {
        merged.set(c, off);
        off += c.length;
      }
      speechPcm16k = [];
      if (rollingPcm16k.length > TARGET_SAMPLE_RATE * 0.4) {
        rollingPcm16k = rollingPcm16k.slice(rollingPcm16k.length - Math.round(TARGET_SAMPLE_RATE * 0.4));
      }
      sendPcmSamplesToGroqWhisper(merged, false);
    }

    // Parallel Web Speech API ONLY for live word preview (NEVER triggers a competing 2nd answer 1-2s later!)
    function startParallelWebSpeech() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return;
      try {
        webSpeechRec = new SR();
        webSpeechRec.continuous = true;
        webSpeechRec.interimResults = true;
        webSpeechRec.lang = 'en-US';
        webSpeechRec.onresult = (event) => {
          if (isReadingLockActive) return;
          const latest = event.results[event.results.length - 1];
          const clean = (latest?.[0]?.transcript || '').trim();
          if (clean.length > 2) {
            if (isCandidateReadingOwnAnswer(clean)) {
              recordCandidateSpokenMemory(clean);
              return;
            }
            heardQuestionLine.textContent = `🎙️ Hearing live: “${clean}”`;
          }
        };
        webSpeechRec.onend = () => {
          if (isMicActive && !isTabSpeakerOnlyMode && webSpeechRec) {
            try { webSpeechRec.start(); } catch (e) {}
          }
        };
        webSpeechRec.start();
      } catch (e) {}
    }

    async function attachPcmPipelineToStream(stream, activeMicName, speakerOnlyMode = false) {
      micStream = stream;
      isMicActive = true;
      isTabSpeakerOnlyMode = Boolean(speakerOnlyMode);
      if (isTabSpeakerOnlyMode) {
        btnToggleMic.classList.remove('active');
        micLabel.textContent = 'Listen Live (Mic Off)';
        heardQuestionLine.textContent = `🔊 Speaker-Only Active: [${activeMicName}] — Your Mic is 100% OFF (Zero Self-Voice)`;
        setTelemetryState('ready', `🟢 Speaker-Only Mode [${activeMicName}] • Your Mic is 100% OFF`);
      } else {
        btnToggleMic.classList.add('active');
        micLabel.textContent = 'Stop Listening';
        heardQuestionLine.textContent = `🎙️ Active Mic: ${activeMicName} — Speak or play phone voice now...`;
        setTelemetryState('ready', `🟢 Listening on [${activeMicName}]`);
      }

      micAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      const source = micAudioCtx.createMediaStreamSource(micStream);
      micProcessor = micAudioCtx.createScriptProcessor(2048, 1, 1);

      const maxRollingSamples = TARGET_SAMPLE_RATE * 8; // 8 seconds
      rollingPcm16k = new Float32Array(0);
      speechPcm16k = [];
      isSpeakingNow = false;
      utterancePeakRms = 0;
      ambientRms = 0.002;

      micProcessor.onaudioprocess = (e) => {
        if (!isMicActive || isReadingLockActive) return;
        const rawInput = e.inputBuffer.getChannelData(0);
        const chunk16k = downsampleTo16k(rawInput, micAudioCtx.sampleRate);

        // Append to rolling 8s buffer
        const combined = new Float32Array(Math.min(maxRollingSamples, rollingPcm16k.length + chunk16k.length));
        const keepOld = combined.length - chunk16k.length;
        if (keepOld > 0) {
          combined.set(rollingPcm16k.subarray(rollingPcm16k.length - keepOld), 0);
        }
        combined.set(chunk16k, keepOld);
        rollingPcm16k = combined;

        // Compute RMS energy
        let sumSq = 0;
        for (let i = 0; i < chunk16k.length; i++) sumSq += chunk16k[i] * chunk16k[i];
        const rms = Math.sqrt(sumSq / chunk16k.length);

        // Visual volume meter
        const meterPct = Math.min(100, Math.round(Math.pow(rms * 18, 0.65) * 100));
        micLevelFill.style.width = meterPct + '%';

        const now = performance.now();

        // While inside the 5.5s Reading Stabilization Shield right after an answer renders, do not start new auto-VAD capture!
        if (lastAnswerRenderedAt > 0 && (now - lastAnswerRenderedAt) < READING_SHIELD_MS) {
          isSpeakingNow = false;
          speechPcm16k = [];
          pauseProgressFill.style.width = '0%';
          return;
        }

        const startThreshold = Math.max(0.0028, Math.min(0.025, ambientRms * 1.75));
        const stopThreshold = Math.min(0.012, Math.max(0.0022, ambientRms * 1.40, utterancePeakRms * 0.12));

        const isActiveVoiceFrame = isSpeakingNow ? rms >= stopThreshold : rms > startThreshold;

        if (isActiveVoiceFrame) {
          if (!isSpeakingNow) {
            isSpeakingNow = true;
            speechStartedAt = now;
            utterancePeakRms = rms;
            const preRollSamples = Math.min(rollingPcm16k.length, Math.round(TARGET_SAMPLE_RATE * 0.65));
            speechPcm16k = [rollingPcm16k.slice(rollingPcm16k.length - preRollSamples)];
          } else {
            speechPcm16k.push(chunk16k);
            if (rms > utterancePeakRms) utterancePeakRms = rms;
          }
          silenceStartedAt = 0;
          pauseProgressFill.style.width = '0%';
          const sec = ((now - speechStartedAt) / 1000).toFixed(1);
          setTelemetryState('hearing', `🔴 Hearing Question (${sec}s) — Answers when interviewer pauses`);

          // Auto-flush if continuous speech reaches 7.5 seconds so it NEVER gets stuck listening!
          if (now - speechStartedAt >= 7500) {
            ambientRms = Math.min(0.010, rms * 0.70);
            flushActiveSpeechToWhisper();
          }
        } else {
          if (isSpeakingNow) {
            speechPcm16k.push(chunk16k);
            if (!silenceStartedAt) silenceStartedAt = now;
            const silenceMs = now - silenceStartedAt;
            const pct = Math.min(100, Math.round((silenceMs / INTERVIEWER_PAUSE_MS) * 100));
            pauseProgressFill.style.width = pct + '%';

            // 1.15s pause after >= 0.40s of voice -> AUTO-COMPLETE & ANSWER ONCE!
            if (silenceMs >= INTERVIEWER_PAUSE_MS) {
              ambientRms = ambientRms * 0.8 + rms * 0.2;
              if (now - speechStartedAt >= 400) {
                flushActiveSpeechToWhisper();
              } else {
                isSpeakingNow = false;
                speechPcm16k = [];
                utterancePeakRms = 0;
                silenceStartedAt = 0;
                pauseProgressFill.style.width = '0%';
                setTelemetryState('ready', '🟢 Listening for next question...');
              }
            }
          } else {
            ambientRms = ambientRms * 0.93 + rms * 0.07;
          }
        }
      };

      source.connect(micProcessor);
      micProcessor.connect(micAudioCtx.destination);
      if (!isTabSpeakerOnlyMode) {
        startParallelWebSpeech();
      }
    }

    async function startLiveMicrophone() {
      try {
        if (tabAudioStream) {
          tabAudioStream.getTracks().forEach((t) => t.stop());
          tabAudioStream = null;
          btnHeadphoneMode.classList.remove('active');
          headphoneLabel.textContent = 'Interviewer Speaker Only (Tab)';
        }
        // 1. Unlock permission & device labels
        const initialStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true }
        });
        await populateMicDevices();

        // 2. If default device was Bluetooth earbuds (e.g. Airdopes), automatically switch to MacBook Pro Built-in Mic!
        let chosenStream = initialStream;
        const initialLabel = initialStream.getAudioTracks()[0]?.label || '';
        if (selectedMicDeviceId && !/macbook|built-in|internal|fake/i.test(initialLabel)) {
          initialStream.getTracks().forEach((t) => t.stop());
          chosenStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              deviceId: { exact: selectedMicDeviceId },
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: true
            }
          });
        }

        const activeMicName = chosenStream.getAudioTracks()[0]?.label || 'Microphone';
        await attachPcmPipelineToStream(chosenStream, activeMicName, false);
      } catch (err) {
        alert('Microphone access error: ' + err.message);
      }
    }

    function stopLiveMicrophone() {
      isMicActive = false;
      isTabSpeakerOnlyMode = false;
      isSpeakingNow = false;
      btnToggleMic.classList.remove('active');
      micLabel.textContent = 'Listen Live';
      micLevelFill.style.width = '0%';
      pauseProgressFill.style.width = '0%';
      setTelemetryState('ready', 'READY • Click "🎙️ Listen Live" or "🔊 Interviewer Speaker Only (Tab)" below');

      if (webSpeechRec) {
        const r = webSpeechRec;
        webSpeechRec = null;
        try { r.stop(); } catch (e) {}
      }
      if (micProcessor) { try { micProcessor.disconnect(); } catch (e) {} micProcessor = null; }
      if (micAudioCtx) { try { micAudioCtx.close(); } catch (e) {} micAudioCtx = null; }
      if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
    }

    btnToggleMic.addEventListener('click', () => {
      if (isMicActive) {
        stopLiveMicrophone();
      } else {
        startLiveMicrophone();
      }
    });

    // "⚡ Answer Last 6s Now (Enter)" — Unconditionally transcribes the last 6 seconds from the rolling buffer!
    btnForceAnswerNow.addEventListener('click', () => {
      if (isMicActive && rollingPcm16k.length > TARGET_SAMPLE_RATE * 0.5) {
        isSpeakingNow = false;
        speechPcm16k = [];
        pauseProgressFill.style.width = '0%';
        const last6s = rollingPcm16k.slice(Math.max(0, rollingPcm16k.length - TARGET_SAMPLE_RATE * 6));
        sendPcmSamplesToGroqWhisper(last6s, true);
      } else if (questionInput.value.trim().length > 2) {
        processLiveInterviewerQuestion(questionInput.value.trim(), true);
      }
    });

    populateMicDevices();

    // =========================================================================
    // 6. SPEAKER-ONLY / CALL TAB AUDIO CAPTURE (100% ZERO MICROPHONE INPUT)
    // =========================================================================
    let tabAudioStream = null;

    btnHeadphoneMode.addEventListener('click', async () => {
      if (tabAudioStream) {
        tabAudioStream.getTracks().forEach((t) => t.stop());
        tabAudioStream = null;
        stopLiveMicrophone();
        btnHeadphoneMode.classList.remove('active');
        headphoneLabel.textContent = 'Interviewer Speaker Only (Tab)';
        return;
      }
      try {
        // First shut off any active physical microphone so your voice is 100% ignored!
        stopLiveMicrophone();

        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        if (!stream.getAudioTracks().length) {
          stream.getTracks().forEach((t) => t.stop());
          alert('Please check "Also share tab audio" when selecting the browser tab!');
          return;
        }
        tabAudioStream = stream;
        btnHeadphoneMode.classList.add('active');
        headphoneLabel.textContent = 'Speaker-Only Active (Mic OFF)';

        const audioOnlyStream = new MediaStream(stream.getAudioTracks());
        await attachPcmPipelineToStream(audioOnlyStream, 'Interviewer Call Tab Speaker', true);
      } catch (err) {
        heardQuestionLine.textContent = 'Select your Meet / Zoom / Gemini browser tab and check "Also share tab audio"';
      }
    });

    // =========================================================================
    // 7. 1-CLICK SPOKEN AI HIRING MANAGER
    // =========================================================================
    const MOCK_QUESTIONS = [
      'Walk me through how you scaled 14+ designers into a UX-as-a-Service organization at IBM and Zebra while keeping 100% retention.',
      'At IBM Software Labs, enterprise architects often distrust generative AI. How did your 3-tier confidence gating and blast-radius preview work?',
      'Tell me about a time Engineering pushed back against your UX design because of tight sprint deadlines. How did you resolve it?',
      'At Ericsson Global, how did you replace a 14-tab Excel workbook across 45 countries and cut quote turnaround from 6 days to 42 minutes?',
      'Tell me about a time a designer on your team was underperforming. How did you coach them and turn that around?',
      'At Zebra Technologies, how did field research in cold-storage warehouses shape your gloved-touch UX across 38,000 handhelds?',
      'Why are you looking to transition from IBM, and what would your first 90 days look like in this role?'
    ];
    let mockIdx = 0;
    let lastMockQuestion = '';

    function speakAndAnswerMockQuestion(qText) {
      lastMockQuestion = qText;
      processLiveInterviewerQuestion(qText, true);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(qText);
        utter.rate = 1.02;
        window.speechSynthesis.speak(utter);
      }
    }

    document.getElementById('btnMockAskQuestion').addEventListener('click', () => {
      const q = MOCK_QUESTIONS[mockIdx % MOCK_QUESTIONS.length];
      mockIdx++;
      speakAndAnswerMockQuestion(q);
    });

    document.getElementById('btnMockFollowUp').addEventListener('click', async () => {
      const prev = lastMockQuestion || questionInput.value || 'your AI and Design System leadership at IBM';
      setTelemetryState('thinking', '🤖 Hiring Manager formulating follow-up...');
      try {
        const d = await callGroq([
          {
            role: 'system',
            content: 'You are a Hiring Manager interviewing Balaajee V.R. Ask ONE short 1-sentence follow-up question drilling into the previous topic. Return ONLY JSON: {"q":"..."}'
          },
          { role: 'user', content: `Previous question: "${prev}"` }
        ], 'openai/gpt-oss-20b');
        const parsed = JSON.parse(d.choices[0].message.content);
        if (parsed.q) {
          speakAndAnswerMockQuestion(parsed.q);
          return;
        }
      } catch (e) {}
      speakAndAnswerMockQuestion('How did you measure the business impact of that, and what would you do differently next time?');
    });

    // =========================================================================
    // 8. FONT SIZE, MANUAL INPUT & SHORTCUTS
    // =========================================================================
    document.getElementById('btnFontDown').addEventListener('click', () => {
      fontSizePx = Math.max(20, fontSizePx - 3);
      document.documentElement.style.setProperty('--prompt-size', fontSizePx + 'px');
    });
    document.getElementById('btnFontUp').addEventListener('click', () => {
      fontSizePx = Math.min(44, fontSizePx + 3);
      document.documentElement.style.setProperty('--prompt-size', fontSizePx + 'px');
    });

    document.getElementById('btnAskNow').addEventListener('click', () => {
      const v = questionInput.value.trim();
      if (v) processLiveInterviewerQuestion(v, true);
    });
    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const v = questionInput.value.trim();
        if (v) processLiveInterviewerQuestion(v, true);
      }
    });

    const brainModal = document.getElementById('brainModal');
    const targetJobInput = document.getElementById('targetJobInput');
    const masterDossierInput = document.getElementById('masterDossierInput');
    const groqKeyInput = document.getElementById('groqKeyInput');

    document.getElementById('btnOpenBrain').addEventListener('click', () => {
      targetJobInput.value = targetJobContext;
      masterDossierInput.value = masterDossier;
      groqKeyInput.value = groqApiKey;
      brainModal.classList.add('open');
    });
    document.getElementById('btnCloseBrainModal').addEventListener('click', () => brainModal.classList.remove('open'));
    document.getElementById('btnSaveBrain').addEventListener('click', () => {
      targetJobContext = targetJobInput.value.trim();
      masterDossier = masterDossierInput.value.trim() || DEFAULT_BALAAJEE_DOSSIER;
      groqApiKey = groqKeyInput.value.trim() || decodePreloadedKey();
      localStorage.setItem(STORAGE_KEY_TARGET_JD, targetJobContext);
      localStorage.setItem(STORAGE_KEY_DOSSIER, masterDossier);
      localStorage.setItem(STORAGE_KEY_GROQ, groqApiKey);
      brainModal.classList.remove('open');
    });

    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) {
        if (e.key === 'Escape') document.activeElement.blur();
        return;
      }
      if (e.code === 'Space') {
        e.preventDefault();
        toggleReadingLock();
      } else if (e.key === 'ArrowDown') {
        const box = document.getElementById('activeAnswerBox');
        if (box) { e.preventDefault(); stopAutoGlide(); box.scrollTop += 44; }
      } else if (e.key === 'ArrowUp') {
        const box = document.getElementById('activeAnswerBox');
        if (box) { e.preventDefault(); stopAutoGlide(); box.scrollTop -= 44; }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        btnForceAnswerNow.click();
      } else {
        const pb = PLAYBOOKS.find((p) => p.key === e.key);
        if (pb) {
          e.preventDefault();
          activePlaybookId = pb.id;
          heardQuestionLine.textContent = `📌 Topic: ${pb.label}`;
          renderBlocksToScreen([pb.blocks.join(' ')], true, `Topic Selected: ${pb.label}`);
        }
      }
    });

    // Boot with a single clean ready card (zero irrelevant pre-filled blocks)
    renderBlocksToScreen([
      'Click <strong>🎙️ Listen Live</strong> below and speak or play your phone interviewer — your direct answer will appear right here.'
    ], false);
  </script>
</body>
</html>
