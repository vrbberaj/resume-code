    function downsampleTo16k(buffer, inputSampleRate) {
      if (inputSampleRate === TARGET_SAMPLE_RATE) return new Float32Array(buffer);
      const ratio = inputSampleRate / TARGET_SAMPLE_RATE;
      const newLen = Math.round(buffer.length / ratio);
      const result = new Float32Array(newLen);
      let offsetResult = 0;
      let offsetBuffer = 0;
      while (offsetResult < result.length) {
        const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
        let accum = 0;
        let count = 0;
        for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
          accum += buffer[i];
          count++;
        }
        result[offsetResult] = count > 0 ? accum / count : 0;
        offsetResult++;
        offsetBuffer = nextOffsetBuffer;
      }
      return result;
    }

    function encodePeakNormalizedWAV(samples16k) {
      let peak = 0;
      for (let i = 0; i < samples16k.length; i++) {
        const abs = Math.abs(samples16k[i]);
        if (abs > peak) peak = abs;
      }
      const gain = peak > 0.001 ? Math.min(20.0, 0.85 / peak) : 1.0;

      const buffer = new ArrayBuffer(44 + samples16k.length * 2);
      const view = new DataView(buffer);
      const writeStr = (off, s) => {
        for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i));
      };
      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + samples16k.length * 2, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, TARGET_SAMPLE_RATE, true);
      view.setUint32(28, TARGET_SAMPLE_RATE * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, samples16k.length * 2, true);

      let offset = 44;
      for (let i = 0; i < samples16k.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, samples16k[i] * gain));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
      return new Blob([view], { type: 'audio/wav' });
    }

    // LIVE ROLLING WHISPER CAPTION STREAMER:
    // Runs every 950ms WHILE the interviewer is speaking so the question appears as live caption text
    // at the very top of the screen while the AI pre-thinks silently in the background!
    async function pollLiveWhisperCaptions() {
      if (isPollingLiveWhisper || !isSpeakingNow || !speechPcm16k.length) return;
      const totalLen = speechPcm16k.reduce((acc, c) => acc + c.length, 0);
      if (totalLen < TARGET_SAMPLE_RATE * 0.65) return;

      isPollingLiveWhisper = true;
      const abortCtrl = new AbortController();
      const timeoutId = setTimeout(() => {
        try { abortCtrl.abort(); } catch (e) {}
      }, 3600);

      try {
        const snapshot = new Float32Array(totalLen);
        let off = 0;
        for (const c of speechPcm16k) {
          snapshot.set(c, off);
          off += c.length;
        }
        const wavBlob = encodePeakNormalizedWAV(snapshot);
        const formData = new FormData();
        formData.append('file', wavBlob, 'live_caption.wav');
        formData.append('model', 'whisper-large-v3-turbo');
        formData.append('language', 'en');

        const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${groqApiKey}` },
          body: formData,
          signal: abortCtrl.signal
        });
        if (res.ok && isSpeakingNow) {
          const data = await res.json();
          const liveText = (data.text || '').replace(/\[.*?\]|\(.*?\)/g, '').trim();
          const isHallucination = /^(thank you\.?|thanks for watching\.?|you\.?|bye\.?|okay\.?|subtitles.*|\.+)$/i.test(liveText);
          if (liveText && liveText.length > 3 && !isHallucination) {
            if (!isCandidateReadingOwnAnswer(liveText)) {
              latestLiveWhisperText = liveText;
              const webSpeechSnapshot = [...currentWebSpeechFinalSegments, currentWebSpeechInterim].join(' ').replace(/\s+/g, ' ').trim();
              const mergedLive = mergeWhisperAndWebSpeech(liveText, webSpeechSnapshot);
              updateLiveInterviewerBubble(mergedLive, false);
            } else {
              recordCandidateSpokenMemory(liveText);
            }
          }
        }
      } catch (e) {
      } finally {
        clearTimeout(timeoutId);
        isPollingLiveWhisper = false;
      }
    }

    // SINGLE FINAL TRANSCRIPTION & ANSWER TRIGGER:
    // Waits until the interviewer has completely finished speaking, merges Whisper + Web Speech once,
    // and triggers ONLY ONE Final Answer on screen (never overwriting it later!).
    async function sendPcmSamplesToGroqWhisper(samples16k, isManualForce = false) {
      const webSpeechSnapshot = [...currentWebSpeechFinalSegments, currentWebSpeechInterim].join(' ').replace(/\s+/g, ' ').trim();
      const immediateLiveQuestion = mergeWhisperAndWebSpeech(latestLiveWhisperText, webSpeechSnapshot);

      if (!samples16k || samples16k.length < TARGET_SAMPLE_RATE * 0.30) {
        if (immediateLiveQuestion && immediateLiveQuestion.length > 3) {
          processLiveInterviewerQuestion(immediateLiveQuestion, isManualForce);
        }
        return;
      }

      if (isTranscribingWhisper) {
        if (pendingWhisperSamples) {
          const joined = new Float32Array(pendingWhisperSamples.length + samples16k.length);
          joined.set(pendingWhisperSamples, 0);
          joined.set(samples16k, pendingWhisperSamples.length);
          pendingWhisperSamples = joined;
        } else {
          pendingWhisperSamples = samples16k;
        }
        return;
      }

      isTranscribingWhisper = true;
      setTelemetryState('thinking', '⚡ Question complete! Streaming final answer word-by-word...');

      let transcribedQuestion = '';
      const abortCtrl = new AbortController();
      const timeoutId = setTimeout(() => {
        try { abortCtrl.abort(); } catch (e) {}
      }, 4000);

      try {
        const wavBlob = encodePeakNormalizedWAV(samples16k);
        const formData = new FormData();
        formData.append('file', wavBlob, 'speech.wav');
        formData.append('model', 'whisper-large-v3-turbo');
        formData.append('language', 'en');

        const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${groqApiKey}` },
          body: formData,
          signal: abortCtrl.signal
        });

        if (res.ok) {
          const data = await res.json();
          const whisperText = (data.text || '').replace(/\[.*?\]|\(.*?\)/g, '').trim();
          const isHallucination = /^(thank you\.?|thanks for watching\.?|you\.?|bye\.?|okay\.?|subtitles.*|\.+)$/i.test(whisperText);

          if (whisperText && whisperText.length > 3 && !isHallucination) {
            transcribedQuestion = mergeWhisperAndWebSpeech(whisperText, immediateLiveQuestion);
          } else if (immediateLiveQuestion.length > 3) {
            transcribedQuestion = immediateLiveQuestion;
          }
        }
      } catch (err) {
        if (immediateLiveQuestion.length > 3) {
          transcribedQuestion = immediateLiveQuestion;
        }
      } finally {
        clearTimeout(timeoutId);
        isTranscribingWhisper = false;
      }

      if (pendingWhisperSamples) {
        const nextSamples = pendingWhisperSamples;
        pendingWhisperSamples = null;
        const combinedSamples = new Float32Array(samples16k.length + nextSamples.length);
        combinedSamples.set(samples16k, 0);
        combinedSamples.set(nextSamples, samples16k.length);
        sendPcmSamplesToGroqWhisper(combinedSamples, isManualForce);
        return;
      }

      if (transcribedQuestion) {
        const now = performance.now();
        if (isManualForce || transcribedQuestion !== lastProcessedQuestion || now - lastTranscriptTime > 1500) {
          lastProcessedQuestion = transcribedQuestion;
          lastTranscriptTime = now;
          processLiveInterviewerQuestion(transcribedQuestion, isManualForce);
        }
      } else {
        setTelemetryState('ready', '🟢 Listening for next interviewer question...');
      }
    }

    function flushActiveSpeechToWhisper() {
      isSpeakingNow = false;
      silenceStartedAt = 0;
      utterancePeakRms = 0;
      pauseProgressFill.style.width = '0%';

      if (!speechPcm16k.length) {
        if (latestLiveCaptionText && latestLiveCaptionText.length > 3) {
          processLiveInterviewerQuestion(latestLiveCaptionText, false);
        }
        return;
      }
      const totalLen = speechPcm16k.reduce((acc, c) => acc + c.length, 0);
      const merged = new Float32Array(totalLen);
      let off = 0;
      for (const c of speechPcm16k) {
        merged.set(c, off);
        off += c.length;
      }
      speechPcm16k = [];
      if (rollingPcm16k.length > TARGET_SAMPLE_RATE * 0.6) {
        rollingPcm16k = rollingPcm16k.slice(rollingPcm16k.length - Math.round(TARGET_SAMPLE_RATE * 0.6));
      }
      sendPcmSamplesToGroqWhisper(merged, false);
    }

    // Parallel Web Speech API:
    // Streams live word-by-word captions into the Top Question Bubble (pushing the last answer down!)
    // AND triggers Early-Intent Answer Streaming as soon as the question intent is clear!
    function startParallelWebSpeech() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return;
      try {
        webSpeechRec = new SR();
        webSpeechRec.continuous = true;
        webSpeechRec.interimResults = true;
        webSpeechRec.lang = 'en-US';
        webSpeechRec.onresult = (event) => {
          if (isReadingLockActive) return;
          lastWebSpeechWordAt = performance.now();

          const latest = event.results[event.results.length - 1];
          const latestChunk = (latest?.[0]?.transcript || '').trim();
          if (
            turnLifecycleState === 'IDLE_OR_READING' &&
            latestChunk.length > 2 &&
            isCandidateReadingOwnAnswer(latestChunk)
          ) {
            recordCandidateSpokenMemory(latestChunk);
            return;
          }

          let interim = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const seg = (event.results[i]?.[0]?.transcript || '').trim();
            if (!seg) continue;
            if (event.results[i].isFinal) {
              if (!isCandidateReadingOwnAnswer(seg)) {
                currentWebSpeechFinalSegments.push(seg);
              }
            } else {
              interim += (interim ? ' ' : '') + seg;
            }
          }
          currentWebSpeechInterim = interim;
          const fullLiveQuestion = [...currentWebSpeechFinalSegments, currentWebSpeechInterim]
            .join(' ')
            .replace(/\s+/g, ' ')
            .trim();

          if (fullLiveQuestion.length > 2) {
            updateLiveInterviewerBubble(fullLiveQuestion, false);
          }
        };
        webSpeechRec.onend = () => {
          if (isMicActive && !isTabSpeakerOnlyMode && webSpeechRec) {
            try { webSpeechRec.start(); } catch (e) {}
          }
        };
        webSpeechRec.start();
      } catch (e) {}
    }

    async function attachPcmPipelineToStream(stream, activeMicName, speakerOnlyMode = false) {
      micStream = stream;
      isMicActive = true;
      isTabSpeakerOnlyMode = Boolean(speakerOnlyMode);
      if (isTabSpeakerOnlyMode) {
        btnToggleMic.classList.remove('active');
        micLabel.textContent = 'Listen Live (Mic Off)';
        heardQuestionLine.textContent = `🔊 Speaker-Only Active: [${activeMicName}] — Your Mic is 100% OFF (Zero Self-Voice)`;
        setTelemetryState('ready', `🟢 Speaker-Only Mode [${activeMicName}] • Your Mic is 100% OFF`);
      } else {
        btnToggleMic.classList.add('active');
        micLabel.textContent = 'Stop Listening';
        heardQuestionLine.textContent = `🎙️ Active Mic: ${activeMicName} — Live captions + Early-Intent word-by-word answer streaming active`;
        setTelemetryState('ready', `🟢 Listening on [${activeMicName}]`);
      }

      micAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      const source = micAudioCtx.createMediaStreamSource(micStream);
      micProcessor = micAudioCtx.createScriptProcessor(2048, 1, 1);

      const maxRollingSamples = TARGET_SAMPLE_RATE * 15;
      rollingPcm16k = new Float32Array(0);
      speechPcm16k = [];
      isSpeakingNow = false;
      utterancePeakRms = 0;
      ambientRms = 0.002;

      micProcessor.onaudioprocess = (e) => {
        if (!isMicActive || isReadingLockActive) return;
        const rawInput = e.inputBuffer.getChannelData(0);
        const chunk16k = downsampleTo16k(rawInput, micAudioCtx.sampleRate);

        const combined = new Float32Array(Math.min(maxRollingSamples, rollingPcm16k.length + chunk16k.length));
        const keepOld = combined.length - chunk16k.length;
        if (keepOld > 0) {
          combined.set(rollingPcm16k.subarray(rollingPcm16k.length - keepOld), 0);
        }
        combined.set(chunk16k, keepOld);
        rollingPcm16k = combined;

        let sumSq = 0;
        for (let i = 0; i < chunk16k.length; i++) sumSq += chunk16k[i] * chunk16k[i];
        const rms = Math.sqrt(sumSq / chunk16k.length);

        const meterPct = Math.min(100, Math.round(Math.pow(rms * 18, 0.65) * 100));
        micLevelFill.style.width = meterPct + '%';

        const now = performance.now();

        // Cap ambientRms at 0.0045 AND scale stopThreshold with utterancePeakRms (20% of speech peak)
        // so phone speaker hiss / room AC NEVER holds isSpeakingNow open after the interviewer finishes speaking!
        ambientRms = Math.min(0.0045, ambientRms);
        const dynamicPeakStop = utterancePeakRms > 0.007 ? Math.min(0.014, utterancePeakRms * 0.20) : 0;
        const startThreshold = Math.max(0.0026, Math.min(0.0110, ambientRms * 1.65));
        const stopThreshold = Math.max(0.0020, Math.min(0.0080, ambientRms * 1.28), dynamicPeakStop);

        const isActiveVoiceFrame = isSpeakingNow ? rms >= stopThreshold : rms > startThreshold;

        if (isActiveVoiceFrame) {
          if (!isSpeakingNow) {
            isSpeakingNow = true;
            speechStartedAt = now;
            lastLiveWhisperTickAt = now;
            utterancePeakRms = rms;
            const preRollSamples = Math.min(rollingPcm16k.length, Math.round(TARGET_SAMPLE_RATE * 1.2));
            speechPcm16k = [rollingPcm16k.slice(rollingPcm16k.length - preRollSamples)];

            if (isTabSpeakerOnlyMode || currentTurnAlreadyMovedToChat) {
              updateLiveInterviewerBubble('Listening & transcribing live question...', false);
            }
          } else {
            speechPcm16k.push(chunk16k);
            if (rms > utterancePeakRms) utterancePeakRms = rms;
          }
          silenceStartedAt = 0;
          pauseProgressFill.style.width = '0%';
          const sec = ((now - speechStartedAt) / 1000).toFixed(1);
          setTelemetryState(
            'hearing',
            `🔴 Interviewer Speaking (${sec}s) — AI thinking silently in background (Final answer streams when question completes)`
          );

          // Every 950ms while speaking, stream live Whisper captions!
          if (now - lastLiveWhisperTickAt >= 950) {
            lastLiveWhisperTickAt = now;
            pollLiveWhisperCaptions();
          }

          if (now - speechStartedAt >= 16000) {
            ambientRms = Math.min(0.0045, rms * 0.65);
            flushActiveSpeechToWhisper();
          }
        } else {
          if (isSpeakingNow) {
            speechPcm16k.push(chunk16k);
            if (!silenceStartedAt) silenceStartedAt = now;
            const silenceMs = now - silenceStartedAt;
            const pct = Math.min(100, Math.round((silenceMs / INTERVIEWER_PAUSE_MS) * 100));
            pauseProgressFill.style.width = pct + '%';

            if (silenceMs >= 220 && silenceMs < 380 && now - lastLiveWhisperTickAt >= 420) {
              lastLiveWhisperTickAt = now;
              pollLiveWhisperCaptions();
            }

            if (silenceMs >= INTERVIEWER_PAUSE_MS) {
              ambientRms = Math.min(0.0042, ambientRms * 0.85 + rms * 0.15);
              if (now - speechStartedAt >= 350) {
                flushActiveSpeechToWhisper();
              } else {
                isSpeakingNow = false;
                speechPcm16k = [];
                utterancePeakRms = 0;
                silenceStartedAt = 0;
                pauseProgressFill.style.width = '0%';
                setTelemetryState('ready', '🟢 Listening for next question...');
              }
            }
          } else {
            ambientRms = Math.min(0.0042, ambientRms * 0.94 + rms * 0.06);
          }
        }
      };

      source.connect(micProcessor);
      micProcessor.connect(micAudioCtx.destination);
      if (!isTabSpeakerOnlyMode) {
        startParallelWebSpeech();
      }
    }

    async function startLiveMicrophone() {
      try {
        if (tabAudioStream) {
          tabAudioStream.getTracks().forEach((t) => t.stop());
          tabAudioStream = null;
          btnHeadphoneMode.classList.remove('active');
          headphoneLabel.textContent = 'Interviewer Speaker Only (Tab)';
        }
        const initialStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true }
        });
        await populateMicDevices();

        let chosenStream = initialStream;
        const initialLabel = initialStream.getAudioTracks()[0]?.label || '';
        if (selectedMicDeviceId && !/macbook|built-in|internal|fake/i.test(initialLabel)) {
          initialStream.getTracks().forEach((t) => t.stop());
          chosenStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              deviceId: { exact: selectedMicDeviceId },
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: true
            }
          });
        }

        const activeMicName = chosenStream.getAudioTracks()[0]?.label || 'Microphone';
        await attachPcmPipelineToStream(chosenStream, activeMicName, false);
      } catch (err) {
        alert('Microphone access error: ' + err.message);
      }
    }

    function stopLiveMicrophone() {
      isMicActive = false;
      isTabSpeakerOnlyMode = false;
      isSpeakingNow = false;
      btnToggleMic.classList.remove('active');
      micLabel.textContent = 'Listen Live';
      micLevelFill.style.width = '0%';
      pauseProgressFill.style.width = '0%';
      setTelemetryState('ready', 'READY • Click "🎙️ Listen Live" or "🔊 Interviewer Speaker Only (Tab)" below');

      if (webSpeechRec) {
        const r = webSpeechRec;
        webSpeechRec = null;
        try { r.stop(); } catch (e) {}
      }
      if (micProcessor) { try { micProcessor.disconnect(); } catch (e) {} micProcessor = null; }
      if (micAudioCtx) { try { micAudioCtx.close(); } catch (e) {} micAudioCtx = null; }
      if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
    }

    btnToggleMic.addEventListener('click', () => {
      if (isMicActive) {
        stopLiveMicrophone();
      } else {
        startLiveMicrophone();
      }
    });

    // "⚡ Answer Now (Enter)" — Transcribes the entire active speech or last 12 seconds of rolling audio!
    btnForceAnswerNow.addEventListener('click', () => {
      if (isMicActive && speechPcm16k.length > 0) {
        flushActiveSpeechToWhisper();
      } else if (isMicActive && rollingPcm16k.length > TARGET_SAMPLE_RATE * 0.5) {
        isSpeakingNow = false;
        speechPcm16k = [];
        pauseProgressFill.style.width = '0%';
        const last12s = rollingPcm16k.slice(Math.max(0, rollingPcm16k.length - TARGET_SAMPLE_RATE * 12));
        sendPcmSamplesToGroqWhisper(last12s, true);
      } else if (questionInput.value.trim().length > 2) {
        processLiveInterviewerQuestion(questionInput.value.trim(), true);
      }
    });

    populateMicDevices();

    // =========================================================================
    // 6. SPEAKER-ONLY / CALL TAB AUDIO CAPTURE (100% ZERO MICROPHONE INPUT)
    // =========================================================================
    let tabAudioStream = null;

    btnHeadphoneMode.addEventListener('click', async () => {
      if (tabAudioStream) {
        tabAudioStream.getTracks().forEach((t) => t.stop());
        tabAudioStream = null;
        stopLiveMicrophone();
        btnHeadphoneMode.classList.remove('active');
        headphoneLabel.textContent = 'Interviewer Speaker Only (Tab)';
        return;
      }
      try {
        stopLiveMicrophone();

        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        if (!stream.getAudioTracks().length) {
          stream.getTracks().forEach((t) => t.stop());
          alert('Please check "Also share tab audio" when selecting the browser tab!');
          return;
        }
        tabAudioStream = stream;
        btnHeadphoneMode.classList.add('active');
        headphoneLabel.textContent = 'Speaker-Only Active (Mic OFF)';

        const audioOnlyStream = new MediaStream(stream.getAudioTracks());
        await attachPcmPipelineToStream(audioOnlyStream, 'Interviewer Call Tab Speaker', true);
      } catch (err) {
        heardQuestionLine.textContent = 'Select your Meet / Zoom / Gemini browser tab and check "Also share tab audio"';
      }
    });

    // =========================================================================
    // 7. 1-CLICK SPOKEN AI HIRING MANAGER
    // =========================================================================
    const MOCK_QUESTIONS = [
      'How do you usually approach a project when the requirements are super vague and nobody agrees on what to build first?',
      'Tell me about a time Engineering pushed back against your UX design because of tight sprint deadlines. How did you handle it?',
      'How do you actually use AI tools in your day-to-day design work, and where do you feel AI still falls short?',
      'What do you do when a designer on your team is struggling or missing deadlines? How do you coach them?',
      'How do you get product managers and executives to care about UX improvements when they only care about shipping features fast?',
      'Can you walk me through a really complicated workflow you simplified for everyday users?',
      'Why are you looking for a new role right now, and how would you spend your first 90 days with our team?'
    ];
    let mockIdx = 0;
    let lastMockQuestion = '';

    function speakAndAnswerMockQuestion(qText) {
      lastMockQuestion = qText;
      processLiveInterviewerQuestion(qText, true);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(qText);
        utter.rate = 1.02;
        window.speechSynthesis.speak(utter);
      }
    }

    // Live Word-by-Word Interviewer Speech Simulator:
    // Simulates an interviewer speaking word-by-word:
    // 1) While speaking: shows ONLY the Live Question Transcript while AI pre-thinks silently in background (zero intermediate answers!)
    // 2) Once the question finishes: immediately shows/streams ONLY the single Final Answer!
    window.simulateLiveInterviewerSpeech = async function(fullQuestionText, wordIntervalMs = 140) {
      const words = String(fullQuestionText || '').trim().split(/\s+/).filter(Boolean);
      if (!words.length) return;
      turnLifecycleState = 'IDLE_OR_READING';
      for (let i = 1; i <= words.length; i++) {
        const partial = words.slice(0, i).join(' ');
        updateLiveInterviewerBubble(partial, false);
        await new Promise((r) => setTimeout(r, wordIntervalMs));
      }
      // Wait 550ms as the interviewer finishes speaking so background pre-think completes in hidden memory, then trigger the single Final Answer!
      await new Promise((r) => setTimeout(r, 550));
      await processLiveInterviewerQuestion(words.join(' '), false);
    };

    document.getElementById('btnMockAskQuestion').addEventListener('click', () => {
      const q = MOCK_QUESTIONS[mockIdx % MOCK_QUESTIONS.length];
      mockIdx++;
      speakAndAnswerMockQuestion(q);
    });

    document.getElementById('btnMockFollowUp').addEventListener('click', async () => {
      const prev = lastMockQuestion || questionInput.value || 'your design leadership approach';
      setTelemetryState('thinking', '🤖 Hiring Manager formulating follow-up...');
      try {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${groqApiKey}`
          },
          body: JSON.stringify({
            model: 'qwen/qwen3.8-27b',
            reasoning_effort: 'none',
            temperature: 0.4,
            max_tokens: 90,
            messages: [
              {
                role: 'system',
                content: '/no_think\nYou are a Hiring Manager interviewing Balaajee V.R. Ask ONE natural, conversational follow-up question drilling into his previous answer. Output ONLY the question text (no quotes, no JSON).'
              },
              { role: 'user', content: `Previous question: "${prev}"\nCandidate's previous answer: "${currentDisplayedAnswerPlain}"` }
            ]
          })
        });
        if (res.ok) {
          const d = await res.json();
          const qOut = (d?.choices?.[0]?.message?.content || '').replace(/^["']|["']$/g, '').trim();
          if (qOut.length > 8) {
            speakAndAnswerMockQuestion(qOut);
            return;
          }
        }
      } catch (e) {}
      speakAndAnswerMockQuestion('That makes sense. How did the team react to that change, and what would you do differently next time?');
    });

    // =========================================================================
    // 8. FONT SIZE, MANUAL INPUT & SHORTCUTS
    // =========================================================================
    document.getElementById('btnFontDown').addEventListener('click', () => {
      fontSizePx = Math.max(20, fontSizePx - 3);
      document.documentElement.style.setProperty('--prompt-size', fontSizePx + 'px');
    });
    document.getElementById('btnFontUp').addEventListener('click', () => {
      fontSizePx = Math.min(44, fontSizePx + 3);
      document.documentElement.style.setProperty('--prompt-size', fontSizePx + 'px');
    });

    document.getElementById('btnAskNow').addEventListener('click', () => {
      const v = questionInput.value.trim();
      if (v) processLiveInterviewerQuestion(v, true);
    });
    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const v = questionInput.value.trim();
        if (v) processLiveInterviewerQuestion(v, true);
      }
    });

    const brainModal = document.getElementById('brainModal');
    const targetJobInput = document.getElementById('targetJobInput');
    const masterDossierInput = document.getElementById('masterDossierInput');
    const groqKeyInput = document.getElementById('groqKeyInput');

    document.getElementById('btnOpenBrain').addEventListener('click', () => {
      targetJobInput.value = targetJobContext;
      masterDossierInput.value = masterDossier;
      groqKeyInput.value = groqApiKey;
      brainModal.classList.add('open');
    });
    document.getElementById('btnCloseBrainModal').addEventListener('click', () => brainModal.classList.remove('open'));
    document.getElementById('btnSaveBrain').addEventListener('click', () => {
      targetJobContext = targetJobInput.value.trim();
      masterDossier = masterDossierInput.value.trim() || DEFAULT_BALAAJEE_DOSSIER;
      groqApiKey = groqKeyInput.value.trim() || decodePreloadedKey();
      localStorage.setItem(STORAGE_KEY_TARGET_JD, targetJobContext);
      localStorage.setItem(STORAGE_KEY_DOSSIER, masterDossier);
      localStorage.setItem(STORAGE_KEY_GROQ, groqApiKey);
      brainModal.classList.remove('open');
    });

    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) {
        if (e.key === 'Escape') document.activeElement.blur();
        return;
      }
      if (e.code === 'Space') {
        e.preventDefault();
        toggleReadingLock();
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        moveCurrentTurnDownToChat(true);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (currentAnswerSentencesPlain.length > 1 && activeSentenceIdx > 0) {
          setSentenceProgress(activeSentenceIdx - 1);
        }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        btnForceAnswerNow.click();
      } else {
        const pb = PLAYBOOKS.find((p) => p.key === e.key);
        if (pb) {
          e.preventDefault();
          activePlaybookId = pb.id;
          heardQuestionLine.textContent = `📌 Topic: ${pb.label}`;
          renderBlocksToScreen([pb.blocks.join(' ')], true, `Topic Selected: ${pb.label}`);
        }
      }
    });

    // Boot with a single clean ready card (Answer on top, Question below)
    renderBlocksToScreen([
      'Click <strong>🎙️ Listen Live</strong> below and speak or play your phone interviewer — your answer in <strong>everyday spoken English</strong> will appear right here at the top, with the question right below it.'
    ], false);
  </script>
