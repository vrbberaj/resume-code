<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balaajee V.R. — Executive Speaking Coach & Rehearsal Prompter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #141b26;
      --surface-border: #1f2a3a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --success: #10b981;
      --warning: #f59e0b;
      --purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--surface-border);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Mode Switcher Tabs */
    .mode-switcher {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--surface-border);
      padding: 4px;
      border-radius: 10px;
      gap: 4px;
    }

    .mode-tab {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-tab:hover {
      color: #fff;
    }

    .mode-tab.active {
      background: var(--accent);
      color: #0b0f17;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 28px;
      flex: 1;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 1024px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    /* Video & Stage Column */
    .stage-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stage-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .video-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--surface-border);
    }

    .stage-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease-in-out, transform 8s ease-out;
      transform: scale(1);
    }

    .stage-img.active {
      opacity: 1;
      transform: scale(1.03);
    }

    .user-camera-feed {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: none;
      z-index: 5;
    }

    .live-cue-pill {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.5; }
    }

    .stage-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      width: 0%;
      transition: width 0.1s linear;
    }

    .time-readout {
      display: flex;
      justify-content: space-between;
      font-family: 'Space Grotesk', monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #0b0f17;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--surface-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .btn-secondary.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Teleprompter Column */
    .prompter-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .prompter-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 1.25rem;
      line-height: 1.75;
      font-weight: 500;
      color: #cbd5e1;
      scroll-behavior: smooth;
      max-height: 480px;
    }

    .prompter-box p {
      margin-bottom: 24px;
      transition: color 0.3s ease, transform 0.3s ease, opacity 0.3s ease;
      opacity: 0.65;
    }

    .prompter-box p.active-sentence {
      color: #ffffff;
      font-weight: 700;
      opacity: 1;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
      transform: scale(1.015);
    }

    .coach-pill {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      margin-right: 6px;
      vertical-align: middle;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .cue-framework { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .cue-smile { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .cue-gesture { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .cue-pause { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

    .coaching-tips {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--surface-border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    @media (max-width: 640px) {
      .coaching-tips { grid-template-columns: 1fr; }
    }

    .tip-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .tip-title {
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>

        durationFormatted: "01:15",
        headerDuration: "70–75s",
        fullText: "Here is a quick look inside how I use AI in day-to-day design delivery—and how I scaled this workflow across my 14-person team at IBM. First, during discovery, we never paste raw customer PII into external models. Using redacted enterprise transcripts and SLA rules, I stress-test workflows with AI to surface rare failure states, permission conflicts, and rollback scenarios in hours instead of weeks. Second, instead of debating flat static screens, I generate interactive code prototypes strictly bound to our existing Design System tokens. That means engineers and operators can test real keyboard density, latency states, and human-in-the-loop override diffs on Day Two. Finally, as a manager, individual speed only matters if it scales. Standardizing these prompt playbooks, redaction guardrails, and a 10-point AI UX quality rubric across design, research, and content helped us cut feature cycles from six weeks to under two—without sacrificing enterprise trust.",
        timeline: [
          { start: 0, end: 25, lineId: 'wf_1', frame: 'frame1', cue: 'Screen Beat 1 (0:00–0:25): Show Redacted Spec → Edge-Case Matrix' },
          { start: 25, end: 52, lineId: 'wf_2', frame: 'frame2', cue: 'Screen Beat 2 (0:25–0:52): Click Live Token-Bound HTML/React Prototype' },
          { start: 52, end: 75, lineId: 'wf_3', frame: 'frame3', cue: 'Screen Beat 3 (0:52–1:15): Show 10-Point AI Rubric & 14-Person Team Impact' }
        ],
        html: `
          <p id="wf_1" class="active-sentence">
            <span class="coach-pill cue-framework">0:00–0:25 · Sanitized Edge-Case Synthesis</span>
            “Here is a quick look inside how I use AI in day-to-day design delivery—and how I scaled this workflow across my 14-person team at IBM. First, during discovery, we never paste raw customer PII into external models. Using <strong>redacted enterprise transcripts and SLA rules</strong>, I stress-test workflows with AI to surface rare failure states, permission conflicts, and rollback scenarios in hours instead of weeks.”

            “Finally, as a manager, individual speed only matters if it scales. Standardizing these prompt playbooks, redaction guardrails, and a <strong>10-point AI UX quality rubric across design, research, and content</strong> helped us cut feature cycles from six weeks to under two—without sacrificing enterprise trust.”
          </p>
        `,
        tips: `

            <div class="tip-title">🎥 Loom Recording Setup</div>

          </div>
          <div class="tip-box">
            <div class="tip-title">🛡️ Privacy Mention = Instant Seniority</div>
            <div>Calling out PII redaction in the first 15 seconds immediately signals enterprise CISO awareness to European and US hiring VPs.</div>
          </div>
          <div class="tip-box">
            <div class="tip-title">📈 End on Org Multiplier</div>
            <div>Closing on how all 14 team members adopted the playbook frames you as a Design Leader, not just a solo tool power-user.</div>
          </div>
        `
      }
    };

    let currentModeKey = 'beat';
    let isRunning = false;
    let startTime = null;
    let animFrame = null;
    let voiceGuideEnabled = true;
    let synth = window.speechSynthesis;
    let activeStream = null;

    // DOM Elements
    const playBtn = document.getElementById('playBtn');
    const resetBtn = document.getElementById('resetBtn');
    const voiceGuideBtn = document.getElementById('voiceGuideBtn');
    const toggleCameraBtn = document.getElementById('toggleCameraBtn');
    const userCamera = document.getElementById('userCamera');
    const progressFill = document.getElementById('progressFill');
    const timeElapsed = document.getElementById('timeElapsed');
    const targetDurationEl = document.getElementById('targetDuration');
    const headerDurationEl = document.getElementById('headerDuration');
    const cueText = document.getElementById('cueText');
    const prompterBox = document.getElementById('prompterBox');
    const prompterTitle = document.getElementById('prompterTitle');
    const coachingTips = document.getElementById('coachingTips');
    const refAudioPlayer = document.getElementById('refAudioPlayer');
    const playRefAudioBtn = document.getElementById('playRefAudioBtn');

    const frames = {
      frame1: document.getElementById('frame1'),
      frame2: document.getElementById('frame2'),
      frame3: document.getElementById('frame3')
    };

    function switchMode(modeKey) {
      if (isRunning) resetRehearsal();
      currentModeKey = modeKey;

      // Update Tab Styles
      document.getElementById('tabBeat').classList.toggle('active', modeKey === 'beat');
      document.getElementById('tabWelcome').classList.toggle('active', modeKey === 'welcome');
      const wfTab = document.getElementById('tabAiWorkflow');
      if (wfTab) wfTab.classList.toggle('active', modeKey === 'aiworkflow');
      if (playRefAudioBtn) playRefAudioBtn.style.display = modeKey === 'welcome' ? 'inline-flex' : 'none';

      const config = modes[modeKey];
      prompterTitle.textContent = config.title;
      targetDurationEl.textContent = config.durationFormatted;
      headerDurationEl.textContent = config.headerDuration;
      prompterBox.innerHTML = config.html;
      coachingTips.innerHTML = config.tips;

      resetRehearsal();
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function setFrame(activeFrameId) {
      for (const [id, el] of Object.entries(frames)) {
        if (id === activeFrameId) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      }
    }

    function setActiveLine(lineId) {
      document.querySelectorAll('.prompter-box p').forEach(p => p.classList.remove('active-sentence'));
      const activeEl = document.getElementById(lineId);
      if (activeEl) {
        activeEl.classList.add('active-sentence');
        const offsetTop = activeEl.offsetTop - prompterBox.offsetTop - 50;
        prompterBox.scrollTop = offsetTop;
      }
    }

    let pausedElapsed = 0;

    function updateTick() {
      if (!isRunning) return;
      const config = modes[currentModeKey];
      let elapsed;
      if (currentModeKey === 'welcome' && voiceGuideEnabled && refAudioPlayer && !refAudioPlayer.paused) {
        elapsed = refAudioPlayer.currentTime;
      } else {
        const now = performance.now();
        elapsed = pausedElapsed + (now - startTime) / 1000;
      }

      if (elapsed >= config.duration) {
        progressFill.style.width = '100%';
        timeElapsed.textContent = config.durationFormatted;
        cueText.textContent = "Finished! Hold confident executive smile for 2 seconds.";
        isRunning = false;
        pausedElapsed = 0;
        playBtn.textContent = '▶ Replay';
        playRefAudioBtn.textContent = '🎧 Play Audio Guide';
        playRefAudioBtn.classList.remove('active');
        return;
      }

      progressFill.style.width = `${(elapsed / config.duration) * 100}%`;
      timeElapsed.textContent = formatTime(elapsed);

      // Find current cue
      const currentCue = config.timeline.find(c => elapsed >= c.start && elapsed < c.end) || config.timeline[config.timeline.length - 1];
      if (currentCue) {
        cueText.textContent = currentCue.cue;
        setFrame(currentCue.frame);
        setActiveLine(currentCue.lineId);
      }

      animFrame = requestAnimationFrame(updateTick);
    }

    function speakScript() {
      if (!voiceGuideEnabled) return;
      if (currentModeKey === 'welcome' && refAudioPlayer) {
        if (synth) synth.cancel();
        refAudioPlayer.play();
        playRefAudioBtn.textContent = '⏸ Pause Audio Guide';
        playRefAudioBtn.classList.add('active');
        return;
      }
      if (!('speechSynthesis' in window)) return;
      synth.cancel();

      const textToSpeak = modes[currentModeKey].fullText;
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.rate = 0.95; // 125 WPM executive pace
      utterance.pitch = 0.95;

      const voices = synth.getVoices();
      const selectedVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Daniel') || v.name.includes('Alex')));
      if (selectedVoice) utterance.voice = selectedVoice;

      synth.speak(utterance);
    }

    function resetRehearsal() {
      isRunning = false;
      pausedElapsed = 0;
      cancelAnimationFrame(animFrame);
      if (synth) synth.cancel();
      if (refAudioPlayer) {
        refAudioPlayer.pause();
        refAudioPlayer.currentTime = 0;
      }
      if (playRefAudioBtn) {
        playRefAudioBtn.textContent = '🎧 Play Audio Guide';
        playRefAudioBtn.classList.remove('active');
      }
      progressFill.style.width = '0%';
      timeElapsed.textContent = '00:00';
      setFrame('frame1');
      const config = modes[currentModeKey];
      setActiveLine(config.timeline[0].lineId);
      cueText.textContent = config.timeline[0].cue;
      playBtn.textContent = '▶ Start Rehearsal';
      prompterBox.scrollTop = 0;
    }

    playBtn.addEventListener('click', () => {
      if (isRunning) {
        isRunning = false;
        if (currentModeKey === 'welcome' && voiceGuideEnabled && refAudioPlayer && !refAudioPlayer.paused) {
          pausedElapsed = refAudioPlayer.currentTime;
          refAudioPlayer.pause();
          playRefAudioBtn.textContent = '🎧 Play Audio Guide';
          playRefAudioBtn.classList.remove('active');
        } else {
          pausedElapsed += (performance.now() - startTime) / 1000;
          if (synth) synth.cancel();
        }
        cancelAnimationFrame(animFrame);
        playBtn.textContent = '▶ Resume';
      } else {
        isRunning = true;
        startTime = performance.now();
        playBtn.textContent = '⏸ Pause';
        if (voiceGuideEnabled) speakScript();
        animFrame = requestAnimationFrame(updateTick);
      }
    });

    resetBtn.addEventListener('click', resetRehearsal);

    voiceGuideBtn.addEventListener('click', () => {
      voiceGuideEnabled = !voiceGuideEnabled;
      if (voiceGuideEnabled) {
        voiceGuideBtn.classList.remove('active');
        voiceGuideBtn.textContent = '🎙️ Audio Voice Guide: ON';
      } else {
        voiceGuideBtn.classList.add('active');
        voiceGuideBtn.textContent = '🔇 Audio Voice Guide: MUTED';
        if (synth) synth.cancel();
        if (refAudioPlayer) refAudioPlayer.pause();
        playRefAudioBtn.textContent = '🎧 Play Audio Guide';
        playRefAudioBtn.classList.remove('active');
      }
    });

    toggleCameraBtn.addEventListener('click', async () => {
      if (activeStream) {
        activeStream.getTracks().forEach(track => track.stop());
        activeStream = null;
        userCamera.style.display = 'none';
        toggleCameraBtn.textContent = '📷 Turn On My Webcam (Practice Mirror)';
        toggleCameraBtn.classList.remove('active');
      } else {
        try {
          activeStream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
          userCamera.srcObject = activeStream;
          userCamera.style.display = 'block';
          toggleCameraBtn.textContent = '❌ Turn Off My Webcam';
          toggleCameraBtn.classList.add('active');
        } catch (err) {
          alert("Unable to access camera. Please allow camera permissions in your browser or use reference slides.");
        }
      }
    });

    function toggleRefAudio() {
      if (!refAudioPlayer) return;
      if (refAudioPlayer.paused) {
        if (currentModeKey !== 'welcome') switchMode('welcome');
        voiceGuideEnabled = true;
        voiceGuideBtn.classList.remove('active');
        voiceGuideBtn.textContent = '🎙️ Audio Voice Guide: ON';
        isRunning = true;
        startTime = performance.now();
        playBtn.textContent = '⏸ Pause';
        refAudioPlayer.play();
        playRefAudioBtn.textContent = '⏸ Pause Audio Guide';
        playRefAudioBtn.classList.add('active');
        animFrame = requestAnimationFrame(updateTick);
      } else {
        isRunning = false;
        pausedElapsed = refAudioPlayer.currentTime;
        cancelAnimationFrame(animFrame);
        refAudioPlayer.pause();
        playBtn.textContent = '▶ Resume';
        playRefAudioBtn.textContent = '🎧 Play Audio Guide';
        playRefAudioBtn.classList.remove('active');
      }
    }

    function onRefAudioEnded() {
      isRunning = false;
      pausedElapsed = 0;
      cancelAnimationFrame(animFrame);
      progressFill.style.width = '100%';
      timeElapsed.textContent = modes.welcome.durationFormatted;
      cueText.textContent = "Finished! Hold confident executive smile for 2 seconds.";
      playBtn.textContent = '▶ Replay';
      playRefAudioBtn.textContent = '🎧 Play Audio Guide';
      playRefAudioBtn.classList.remove('active');
    }

    // Initialize in Portfolio Welcome mode by default
    switchMode('welcome');
  </script>
</body>
</html>
