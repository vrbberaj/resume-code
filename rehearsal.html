<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balaajee V.R. — Executive Speaking Coach & Rehearsal Prompter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #141b26;
      --surface-border: #1f2a3a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --success: #10b981;
      --warning: #f59e0b;
      --purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--surface-border);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Mode Switcher Tabs */
    .mode-switcher {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--surface-border);
      padding: 4px;
      border-radius: 10px;
      gap: 4px;
    }

    .mode-tab {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-tab:hover {
      color: #fff;
    }

    .mode-tab.active {
      background: var(--accent);
      color: #0b0f17;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 28px;
      flex: 1;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 1024px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    /* Video & Stage Column */
    .stage-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stage-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .video-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--surface-border);
    }

    .stage-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease-in-out, transform 8s ease-out;
      transform: scale(1);
    }

    .stage-img.active {
      opacity: 1;
      transform: scale(1.03);
    }

    .user-camera-feed {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: none;
      z-index: 5;
    }

    .live-cue-pill {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.5; }
    }

    .stage-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      width: 0%;
      transition: width 0.1s linear;
    }

    .time-readout {
      display: flex;
      justify-content: space-between;
      font-family: 'Space Grotesk', monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #0b0f17;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--surface-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .btn-secondary.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Teleprompter Column */
    .prompter-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .prompter-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 1.25rem;
      line-height: 1.75;
      font-weight: 500;
      color: #cbd5e1;
      scroll-behavior: smooth;
      max-height: 480px;
    }

    .prompter-box p {
      margin-bottom: 24px;
      transition: color 0.3s ease, transform 0.3s ease, opacity 0.3s ease;
      opacity: 0.65;
    }

    .prompter-box p.active-sentence {
      color: #ffffff;
      font-weight: 700;
      opacity: 1;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
      transform: scale(1.015);
    }

    .coach-pill {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      margin-right: 6px;
      vertical-align: middle;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .cue-framework { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .cue-smile { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .cue-gesture { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .cue-pause { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

    .coaching-tips {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--surface-border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    @media (max-width: 640px) {
      .coaching-tips { grid-template-columns: 1fr; }
    }

    .tip-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .tip-title {
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <span>Balaajee V.R.</span>
      <span class="brand-badge">Executive Speaking Coach & Prompter</span>
    </div>

    <!-- Mode Switcher -->
    <div class="mode-switcher">
      <button id="tabBeat" class="mode-tab active" onclick="switchMode('beat')">
        🎯 BEAT Interview Intro (75s)
      </button>
      <button id="tabWelcome" class="mode-tab" onclick="switchMode('welcome')">
        🎬 18 Years in 60s Briefing
      </button>
    </div>

    <div style="font-size: 0.85rem; color: var(--text-muted);">
      Target Duration: <strong id="headerDuration" style="color: #fff;">70–75s</strong> &bull; Pace: <strong style="color: #38bdf8;">125 WPM</strong>
    </div>
  </header>

  <div class="main-grid">

    <!-- Video Stage / Reference / Mirror -->
    <div class="stage-card">
      <div class="stage-header">
        <span class="stage-title">Video Reference & Posture</span>
        <button id="toggleCameraBtn" class="btn btn-secondary" style="font-size: 0.8rem; padding: 6px 12px;">
          📷 Turn On My Webcam (Practice Mirror)
        </button>
      </div>

      <div class="video-viewport">
        <!-- Frame 1: Warm Intro (0:00 - 0:18) -->
        <img id="frame1" class="stage-img active" src="crisp-shirt-no-blazer.jpg" alt="Intro Posture - Warm Smile & Eye Contact">
        <!-- Frame 2: Gesture & Domain (0:19 - 0:52) -->
        <img id="frame2" class="stage-img" src="speaking-gesture.jpg" alt="Active Speaking - Open Conversational Gesture">
        <!-- Frame 3: Warm Call to Action (0:53 - 0:75) -->

      <div class="stage-controls">
        <div class="progress-track" id="progressTrack">

        </div>
        <div class="time-readout">
          <span id="timeElapsed">00:00</span>
          <span id="targetDuration">01:15</span>
        </div>

        <div class="btn-row">
          <button id="playBtn" class="btn btn-primary">▶ Start Rehearsal</button>
          <button id="resetBtn" class="btn btn-secondary">↺ Reset</button>
          <button id="voiceGuideBtn" class="btn btn-secondary">🎙️ Audio Voice Guide: ON</button>
          <button id="playRefAudioBtn" class="btn btn-secondary" onclick="toggleRefAudio()">🎧 Play 60s Executive Audio Guide</button>
        </div>
        <audio id="refAudioPlayer" src="assets/audio_guide_daniel.m4a" preload="auto" onended="onRefAudioEnded()"></audio>
      </div>
    </div>

    <!-- Teleprompter & Coaching Cues -->
    <div class="prompter-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <span id="prompterTitle" class="stage-title">BEAT Framework Prompter</span>
        <span id="wpmBadge" style="font-size: 0.75rem; color: #38bdf8; background: rgba(56,189,248,0.1); padding: 4px 8px; border-radius: 4px;">Pace: 125 WPM</span>
      </div>

      <div class="prompter-box" id="prompterBox">
        <!-- Content will be rendered dynamically based on selected mode -->
      </div>

      <!-- Live Coaching Rules -->
      <div class="coaching-tips" id="coachingTips">
        <!-- Rendered dynamically -->
      </div>
    </div>

  </div>

  <script>
    // Mode Data: BEAT Framework vs Portfolio Welcome
    const modes = {
      beat: {
        title: "BEAT Framework Prompter (Tell Me About Yourself)",
        duration: 75,
        durationFormatted: "01:15",
        headerDuration: "70–75s",
        fullText: "I’m a Senior UI/UX Design Manager with over 18 years of experience building and scaling product design organizations across global technology leaders, including IBM, Ericsson, Zebra Technologies, ZF Wabco, and Infosys. My core focus has always been mission-critical, high-complexity systems, spanning enterprise agentic AI, telecom CPQ, rugged industrial IoT, and connected automotive platforms. My design leadership philosophy centers on bridging deep technical logic with frictionless usability. Today, I actively champion AI transformation across design—both crafting explainable, human-centered AI product experiences and modernizing internal UX workflows with AI-assisted research and design-system automation. Throughout my career, I’ve established zero-defect design systems that accelerated engineering release cycles, led multi-disciplinary teams across global time zones, and mentored over 50 product designers into high-performing contributors. What excited me about this role with your organization is your focus on scaling complex enterprise products. I’m looking to bring my background in design operations, systems thinking, and AI-era UX leadership to help your team achieve that next level of scale.",
        timeline: [
          { start: 0, end: 18, lineId: 'beat_b', frame: 'frame1', cue: '[B] Background & Executive Scope (18+ Yrs, Global Giants)' },
          { start: 18, end: 34, lineId: 'beat_e1', frame: 'frame2', cue: '[E] Expertise & Domains (Enterprise AI, Telecom, Industrial IoT)' },
          { start: 34, end: 52, lineId: 'beat_e2', frame: 'frame2', cue: '[E] 2026 AI Leadership (AI UX Transformation & Modern Workflows)' },
          { start: 52, end: 64, lineId: 'beat_a', frame: 'frame2', cue: '[A] Accomplishments (Zero-Defect Systems, Mentored 50+)' },
          { start: 64, end: 75, lineId: 'beat_t', frame: 'frame3', cue: '[T] Strategic Tie-in (Forward Lean, Company Alignment)' }
        ],
        html: `
          <p id="beat_b" class="active-sentence">
            <span class="coach-pill cue-framework">B — Background</span>
            <span class="coach-pill cue-smile">Warm Smile</span>
            “I’m a Senior UI/UX Design Manager with over 18 years of experience building and scaling product design organizations across global technology leaders—including <strong>IBM</strong>, <strong>Ericsson</strong>, <strong>Zebra Technologies</strong>, <strong>ZF Wabco</strong>, and <strong>Infosys</strong>.”
            <span class="coach-pill cue-pause">1s Breath</span>
          </p>

          <p id="beat_e1">
            <span class="coach-pill cue-framework">E — Expertise</span>
            <span class="coach-pill cue-gesture">Open Palm Gesture</span>
            “My core focus has always been mission-critical, high-complexity systems—spanning <strong>enterprise agentic AI</strong>, <strong>telecom CPQ</strong>, <strong>rugged industrial IoT</strong>, and <strong>connected automotive platforms</strong>.”
          </p>

          <p id="beat_e2">
            <span class="coach-pill cue-framework">E — 2026 AI Leadership</span>
            “My design leadership philosophy centers on bridging deep technical logic with frictionless usability. Today, I actively champion <strong>AI transformation across design</strong>—both crafting explainable, human-centered AI product experiences and modernizing internal UX workflows with AI-assisted research and design-system automation.”
            <span class="coach-pill cue-pause">1s Pause</span>
          </p>

          <p id="beat_a">
            <span class="coach-pill cue-framework">A — Accomplishments</span>
            <span class="coach-pill cue-gesture">Conviction & Scale</span>
            “Throughout my career, I’ve established zero-defect design systems that accelerated engineering release cycles, led multi-disciplinary teams across global time zones, and <strong>mentored over 50 product designers</strong> into high-performing contributors.”
            <span class="coach-pill cue-pause">1s Breath</span>
          </p>

          <p id="beat_t">
            <span class="coach-pill cue-framework">T — Tie-In</span>
            <span class="coach-pill cue-smile">Slight Forward Lean</span>
            “What excited me about this role with your organization is your focus on scaling complex enterprise products. I’m looking to bring my background in design operations, systems thinking, and AI-era UX leadership to help your team achieve that next level of scale.”
          </p>
        `,
        tips: `
          <div class="tip-box">
            <div class="tip-title">🎯 [B & E] Immediate Stature</div>
            <div>Mentioning IBM, Ericsson, and Zebra in the first 15 seconds establishes enterprise authority without reciting college.</div>
          </div>
          <div class="tip-box">
            <div class="tip-title">🤖 [2026 AI Era] Future-Proof</div>
            <div>Calling out AI UX transformation & automated workflows proves you lead modern 2026 design orgs, not legacy waterfall teams.</div>
          </div>
          <div class="tip-box">
            <div class="tip-title">⚡ [A] Concrete Scale</div>
            <div>Highlighting zero-defect systems and 50+ designers mentored answers the management question before they even ask.</div>
          </div>
        `
      },
      welcome: {
        title: "18 Years of UX Leadership in 60 Seconds (Executive Briefing)",
        duration: 60,
        durationFormatted: "01:00",
        headerDuration: "55–60s",
        fullText: "18 years of UX leadership in 60 seconds. Hello, I’m Balaajee, Senior UI/UX Design Manager. Over nearly two decades, I’ve built and scaled product design organizations across global technology leaders—including IBM, Zebra Technologies, Ericsson, ZF Wabco, and Infosys. Starting in software engineering gave me a foundational advantage: bridging design vision with engineering reality, protecting delivery timelines, and scaling enterprise design systems. Today, my focus is driving the AI transformation in UX: crafting explainable, agentic AI experiences for enterprise software, while modernizing our design workflows with AI-accelerated research, prototyping, and governance. My squads turn complex technical ecosystems into high-adoption software. Take a look at my flagship case studies below, and let’s connect to build what’s next.",
        timeline: [
          { start: 0, end: 12, lineId: 'line1', frame: 'frame1', cue: 'Act 1: The 60s Hook & Enterprise Pedigree (Warm Smile & Direct Eye Contact)' },
          { start: 12, end: 26, lineId: 'line2', frame: 'frame2', cue: 'Act 2: The Core Differentiator (Software Engineer to Design Leader)' },
          { start: 26, end: 44, lineId: 'line3', frame: 'frame2', cue: 'Act 3: 2026 AI Transformation & Systems (Forward Lean • Thoughtful)' },
          { start: 44, end: 60, lineId: 'line4', frame: 'frame3', cue: 'Act 4: High-Adoption Impact & Closing (Warm Eye Contact • Hold 2s)' }
        ],
        html: `
          <p id="line1" class="active-sentence">
            <span class="coach-pill cue-smile">Warm Smile & Direct Eye Contact</span>
            “<strong>18 years of UX leadership in 60 seconds.</strong> Hello, I’m <strong>Balaajee</strong>, Senior UI/UX Design Manager. Over nearly two decades, I’ve built and scaled product design organizations across global technology leaders—including <strong>IBM</strong>, <strong>Zebra Technologies</strong>, <strong>Ericsson</strong>, <strong>ZF Wabco</strong>, and <strong>Infosys</strong>.”
            <span class="coach-pill cue-pause">1s Breath</span>
          </p>

          <p id="line2">
            <span class="coach-pill cue-framework">The Differentiator</span>
            <span class="coach-pill cue-gesture">Open Palm Gesture</span>
            “Starting in software engineering gave me a foundational advantage: <strong>bridging design vision with engineering reality</strong>, protecting delivery timelines, and scaling enterprise design systems.”
            <span class="coach-pill cue-pause">1s Breath</span>
          </p>

          <p id="line3">
            <span class="coach-pill cue-framework">2026 AI Transformation</span>
            <span class="coach-pill cue-gesture">Thoughtful & Forward-Looking</span>
            “Today, my focus is driving the <strong>AI transformation in UX</strong>: crafting explainable, agentic AI experiences for enterprise software, while modernizing our design workflows with <strong>AI-accelerated research, prototyping, and governance</strong>.”
            <span class="coach-pill cue-pause">1s Breath</span>
          </p>

          <p id="line4">
            <span class="coach-pill cue-smile">High-Adoption Impact & Call to Action</span>
            “My squads turn complex technical ecosystems into high-adoption software. <strong>Take a look at my flagship case studies below, and let’s connect to build what’s next.</strong>”
          </p>
        `,
        tips: `
          <div class="tip-box">
            <div class="tip-title">⚡ Instant Thumbnail Alignment</div>
            <div>Opening with "18 years of UX leadership in 60 seconds" immediately validates the viewer's click and hooks their curiosity in the first 2 seconds.</div>
          </div>
          <div class="tip-box">
            <div class="tip-title">🤖 Dual AI Leadership Hook</div>
            <div>You address BOTH sides of AI: 1) Crafting agentic AI products for enterprise, and 2) Modernizing internal design workflows with AI tools. That's exactly what modern 2026 VPs look for.</div>
          </div>
          <div class="tip-box">
            <div class="tip-title">👀 The Final 2-Second Hold</div>
            <div>After saying "let's connect to build what's next", hold warm, confident eye contact with the lens for 2 full seconds before ending the take.</div>
          </div>
        `
      }
    };

    let currentModeKey = 'beat';
    let isRunning = false;
    let startTime = null;
    let animFrame = null;
    let voiceGuideEnabled = true;
    let synth = window.speechSynthesis;
    let activeStream = null;

    // DOM Elements
    const playBtn = document.getElementById('playBtn');
    const resetBtn = document.getElementById('resetBtn');
    const voiceGuideBtn = document.getElementById('voiceGuideBtn');
    const toggleCameraBtn = document.getElementById('toggleCameraBtn');
    const userCamera = document.getElementById('userCamera');
    const progressFill = document.getElementById('progressFill');
    const timeElapsed = document.getElementById('timeElapsed');
    const targetDurationEl = document.getElementById('targetDuration');
    const headerDurationEl = document.getElementById('headerDuration');
    const cueText = document.getElementById('cueText');
    const prompterBox = document.getElementById('prompterBox');
    const prompterTitle = document.getElementById('prompterTitle');
    const coachingTips = document.getElementById('coachingTips');

    const frames = {
      frame1: document.getElementById('frame1'),
      frame2: document.getElementById('frame2'),
      frame3: document.getElementById('frame3')
    };

    function switchMode(modeKey) {
      if (isRunning) resetRehearsal();
      currentModeKey = modeKey;

      // Update Tab Styles
      document.getElementById('tabBeat').classList.toggle('active', modeKey === 'beat');
      document.getElementById('tabWelcome').classList.toggle('active', modeKey === 'welcome');

      const config = modes[modeKey];
      prompterTitle.textContent = config.title;
      targetDurationEl.textContent = config.durationFormatted;
      headerDurationEl.textContent = config.headerDuration;
      prompterBox.innerHTML = config.html;
      coachingTips.innerHTML = config.tips;

      resetRehearsal();
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function setFrame(activeFrameId) {
      for (const [id, el] of Object.entries(frames)) {
        if (id === activeFrameId) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      }
    }

    function setActiveLine(lineId) {
      document.querySelectorAll('.prompter-box p').forEach(p => p.classList.remove('active-sentence'));
      const activeEl = document.getElementById(lineId);
      if (activeEl) {
        activeEl.classList.add('active-sentence');
        const offsetTop = activeEl.offsetTop - prompterBox.offsetTop - 50;
        prompterBox.scrollTop = offsetTop;
      }
    }

    function updateTick() {
      if (!isRunning) return;
      const config = modes[currentModeKey];
      const now = performance.now();
      const elapsed = (now - startTime) / 1000;

      if (elapsed >= config.duration) {
        progressFill.style.width = '100%';
        timeElapsed.textContent = config.durationFormatted;
        cueText.textContent = "Finished! Hold confident executive smile for 2 seconds.";
        isRunning = false;
        playBtn.textContent = '▶ Replay';
        return;
      }

      progressFill.style.width = `${(elapsed / config.duration) * 100}%`;
      timeElapsed.textContent = formatTime(elapsed);

      // Find current cue
      const currentCue = config.timeline.find(c => elapsed >= c.start && elapsed < c.end) || config.timeline[config.timeline.length - 1];
      if (currentCue) {
        cueText.textContent = currentCue.cue;
        setFrame(currentCue.frame);
        setActiveLine(currentCue.lineId);
      }

      animFrame = requestAnimationFrame(updateTick);
    }

    function speakScript() {
      if (!('speechSynthesis' in window) || !voiceGuideEnabled) return;
      synth.cancel();

      const textToSpeak = modes[currentModeKey].fullText;
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.rate = 0.95; // 125 WPM executive pace
      utterance.pitch = 0.95;

      const voices = synth.getVoices();
      const selectedVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Daniel') || v.name.includes('Alex')));
      if (selectedVoice) utterance.voice = selectedVoice;

      synth.speak(utterance);
    }

    function resetRehearsal() {
      isRunning = false;
      cancelAnimationFrame(animFrame);
      if (synth) synth.cancel();
      progressFill.style.width = '0%';
      timeElapsed.textContent = '00:00';
      setFrame('frame1');
      const config = modes[currentModeKey];
      setActiveLine(config.timeline[0].lineId);
      cueText.textContent = config.timeline[0].cue;
      playBtn.textContent = '▶ Start Rehearsal';
      prompterBox.scrollTop = 0;
    }

    playBtn.addEventListener('click', () => {
      if (isRunning) {
        isRunning = false;
        cancelAnimationFrame(animFrame);
        if (synth) synth.cancel();
        playBtn.textContent = '▶ Resume';
      } else {
        isRunning = true;
        startTime = performance.now();
        playBtn.textContent = '⏸ Pause';
        if (voiceGuideEnabled) speakScript();
        animFrame = requestAnimationFrame(updateTick);
      }
    });

    resetBtn.addEventListener('click', resetRehearsal);

    voiceGuideBtn.addEventListener('click', () => {
      voiceGuideEnabled = !voiceGuideEnabled;
      if (voiceGuideEnabled) {
        voiceGuideBtn.classList.remove('active');
        voiceGuideBtn.textContent = '🎙️ Audio Voice Guide: ON';
      } else {
        voiceGuideBtn.classList.add('active');
        voiceGuideBtn.textContent = '🔇 Audio Voice Guide: MUTED';
        if (synth) synth.cancel();
      }
    });

    toggleCameraBtn.addEventListener('click', async () => {
      if (activeStream) {
        activeStream.getTracks().forEach(track => track.stop());
        activeStream = null;
        userCamera.style.display = 'none';
        toggleCameraBtn.textContent = '📷 Turn On My Webcam (Practice Mirror)';
        toggleCameraBtn.classList.remove('active');
      } else {
        try {
          activeStream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
          userCamera.srcObject = activeStream;
          userCamera.style.display = 'block';
          toggleCameraBtn.textContent = '❌ Turn Off My Webcam';
          toggleCameraBtn.classList.add('active');
        } catch (err) {
          alert("Unable to access camera. Please allow camera permissions in your browser or use reference slides.");
        }
      }
    });

    const refAudioPlayer = document.getElementById('refAudioPlayer');
    const playRefAudioBtn = document.getElementById('playRefAudioBtn');

    function toggleRefAudio() {
      if (!refAudioPlayer) return;
      if (refAudioPlayer.paused) {
        if (isRunning) resetRehearsal();
        if (synth) synth.cancel();
        refAudioPlayer.play();
        playRefAudioBtn.textContent = '⏸ Pause Audio Guide';
        playRefAudioBtn.classList.add('active');
      } else {
        refAudioPlayer.pause();
        playRefAudioBtn.textContent = '🎧 Play 60s Executive Audio Guide';
        playRefAudioBtn.classList.remove('active');
      }
    }

    function onRefAudioEnded() {
      playRefAudioBtn.textContent = '🎧 Play 60s Executive Audio Guide';
      playRefAudioBtn.classList.remove('active');
    }

    // Initialize in Portfolio Welcome mode by default
    switchMode('welcome');
  </script>
</body>
</html>
